<!doctype html>
<html lang="bn" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talkia</title>
<meta name="theme-color" content="#0a0d14">
<meta name="description" content="Talkia - The Voice Universe">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0d14; --surface:#121826; --surface2:#1a2234; --line:#26314a;
  --text:#eef2fb; --muted:#8b97b3; --accent:#2f6bff; --accent-text:#7aa5ff; --accent-ink:#ffffff; --danger:#ef6b5b;
  --nav-h:68px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Hind Siliguri","Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none !important}

#auth{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px 20px}
.auth-card{width:100%;max-width:400px}
.brand{text-align:center;margin-bottom:28px}
.brand .badge{display:inline-block;background:#fff;border-radius:22px;padding:16px 26px;box-shadow:0 12px 44px rgba(47,107,255,.28)}
.brand .badge img{height:58px;display:block}
.bn-name{margin-top:14px;font-size:20px;font-weight:600;color:var(--accent-text)}
.hbadge{display:flex;background:#fff;border-radius:11px;padding:6px 12px}
.hbadge img{height:24px;display:block}
.brand p{margin:6px 0 0;color:var(--muted);font-size:15px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
.seg button{padding:10px;border-radius:9px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.field{margin-bottom:12px}
.field label{display:block;margin-bottom:4px;font-size:13px;color:var(--muted)}
.field input,.field textarea{width:100%;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);outline:none}
.field textarea{resize:none;min-height:84px}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.btn{width:100%;padding:14px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px}
.btn:disabled{opacity:.6}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.msg{min-height:20px;margin:10px 0;font-size:14px;text-align:center;color:var(--danger)}
.msg.ok{color:#7bd88f}
.langs{display:flex;gap:8px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.langs button{padding:7px 14px;border-radius:99px;border:1px solid var(--line);color:var(--muted);font-size:14px}
.langs button.on{border-color:var(--accent);color:var(--accent-text)}

#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  border-bottom:1px solid var(--line);background:var(--bg)}
.hdr-actions{display:flex;gap:6px}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.icon-btn svg{width:21px;height:21px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;overflow-y:auto;padding:16px 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px)}
.tab{display:none}.tab.active{display:block}
h2{margin:0 0 12px;font-size:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.muted{color:var(--muted)}
.tag{display:inline-block;background:var(--surface2);color:var(--accent-text);border-radius:99px;padding:3px 11px;font-size:13px;margin-inline-end:6px}
.prompt-text{font-size:21px;line-height:1.5;margin:10px 0 16px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .big{font-size:42px;margin-bottom:8px}
.post .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:8px}
.post .play{display:flex;align-items:center;gap:12px;margin-top:12px}
.post .play i{width:40px;height:40px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.post .play i svg{width:16px;height:16px;fill:var(--accent-ink)}
.post .wave{flex:1;height:30px;background:repeating-linear-gradient(90deg,var(--line) 0 3px,transparent 3px 7px);border-radius:4px;opacity:.8}
.profile-top{text-align:center;margin-bottom:18px}
.avatar{width:92px;height:92px;border-radius:50%;margin:0 auto 12px;background:var(--surface2);border:2px solid var(--accent);
  display:grid;place-items:center;font-size:38px;font-weight:700;color:var(--accent-text)}
.profile-top h2{margin:0}
.avatar{position:relative;overflow:hidden;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.field select{width:100%;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);outline:none}
.urow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.uav{width:44px;height:44px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;overflow:hidden;font-weight:700;color:var(--accent-text);flex:none}
.uav img{width:100%;height:100%;object-fit:cover}
.uinfo{flex:1;min-width:0}
.sec-h{margin:18px 0 4px;font-size:15px;color:var(--muted)}
.btn.sm{padding:11px;font-size:15px;margin-top:8px}
#user-sheet{z-index:35}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.chip{flex:none;padding:7px 14px;border-radius:99px;border:1px solid var(--line);color:var(--muted);font-size:14px}
.chip.on{border-color:var(--accent);color:var(--accent-text)}
.phead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.phead .uav{width:36px;height:36px}
.acts{display:flex;gap:20px;margin-top:10px}
.acts button{color:var(--muted);font-size:15px}
.acts button.on{color:var(--danger)}
.wave{position:relative}
.wave b{position:absolute;inset:0 auto 0 0;width:0;background:repeating-linear-gradient(90deg,var(--accent) 0 3px,transparent 3px 7px);border-radius:4px}
.cm{padding:8px 0;border-bottom:1px solid var(--line)}
.avatar-hint{font-size:13px;color:var(--accent-text);margin-bottom:10px;cursor:pointer}
.p-bio{margin:10px 0 0;line-height:1.5}
.p-meta{margin-top:8px}
.profile-top .btn{margin-top:14px;width:auto;padding:10px 22px;font-size:15px}

nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:center;pointer-events:none}
.nav-in{pointer-events:auto;width:100%;max-width:560px;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);align-items:center}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:12px;padding:8px 2px}
.nav-btn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn.on{color:var(--accent-text)}
.nav-rec{position:relative;top:-18px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--accent-text);font-size:12px}
.nav-rec .dot{width:62px;height:62px;border-radius:50%;background:var(--accent);display:grid;place-items:center;
  box-shadow:0 6px 24px rgba(47,107,255,.5);border:4px solid var(--bg)}
.nav-rec .dot svg{width:28px;height:28px;stroke:var(--accent-ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{width:100%;max-width:560px;max-height:90%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));text-align:center;border-top:1px solid var(--line)}
.sheet-in h3{margin:0 0 8px;font-size:20px}
.sheet-in p{color:var(--muted);margin:0 0 18px}
.sheet-in form{text-align:start}
.sheet-in .btn{margin-top:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 30px + env(safe-area-inset-bottom));z-index:40;
  background:var(--surface2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90%}
</style>
</head>
<body>

<section id="auth" class="hidden">
  <div class="auth-card">
    <div class="brand">
      <div class="badge"><img src="logo-wordmark.png" alt="Talkia"></div>
      <div class="bn-name">টকিয়া</div>
      <p data-i18n="tagline"></p>
    </div>
    <div class="seg">
      <button id="mode-login" class="on" data-i18n="login"></button>
      <button id="mode-signup" data-i18n="signup"></button>
    </div>
    <form id="auth-form" autocomplete="on">
      <div class="field hidden" id="name-field"><input id="name" type="text" data-i18n-ph="name" autocomplete="name"></div>
      <div class="field"><input id="email" type="email" data-i18n-ph="email" autocomplete="email" required></div>
      <div class="field"><input id="password" type="password" data-i18n-ph="password" autocomplete="current-password" minlength="6" required></div>
      <div id="auth-msg" class="msg"></div>
      <button class="btn" id="auth-submit" type="submit" data-i18n="login"></button>
    </form>
    <div class="langs" data-langs></div>
  </div>
</section>

<div id="app" class="hidden">
  <header>
    <div class="hbadge"><img src="logo-wordmark.png" alt="Talkia"></div>
    <div class="hdr-actions">
      <button class="icon-btn" id="btn-inbox" aria-label="Inbox">
        <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.5 7.2L3 21l1.8-5.5A8 8 0 1 1 21 12z"/></svg>
      </button>
      <button class="icon-btn" id="btn-bell" aria-label="Notifications">
        <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10.3 20a2 2 0 0 0 3.4 0"/></svg>
      </button>
      <button class="icon-btn" id="btn-search" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l-.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section id="tab-prompt" class="tab">
      <h2 data-i18n="t_prompt"></h2>
      <div class="card">
        <span class="tag">#TalkiaToday</span>
        <div class="prompt-text" id="prompt-text">...</div>
        <button class="btn" id="prompt-answer" data-i18n="answer_prompt"></button>
      </div>
    </section>

    <section id="tab-feed" class="tab">
      <h2 data-i18n="t_feed"></h2>
      <div id="feed-filters"></div>
      <div id="feed-list"></div>
    </section>

    <section id="tab-profile" class="tab">
      <div class="profile-top">
        <div class="avatar" id="p-avatar">T</div>
        <div class="avatar-hint" id="avatar-hint" data-i18n="avatar_change"></div>
        <input type="file" id="avatar-input" accept="image/*" class="hidden">
        <h2 id="p-name"></h2>
        <div class="muted" id="p-username"></div>
        <div class="muted" id="p-email"></div>
        <div class="p-meta" id="p-country"></div>
        <p class="p-bio" id="p-bio"></p>
        <button class="btn ghost" id="btn-edit" data-i18n="edit_profile"></button>
        <button class="btn ghost" id="btn-people" data-i18n="people" style="margin-inline-start:8px"></button>
      </div>
    </section>
  </main>

  <nav>
    <div class="nav-in">
      <button class="nav-btn" data-tab="prompt">
        <svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6L12 16.7 6.7 19.6l1.1-6L3.4 9.4l6-.8z"/></svg>
        <span data-i18n="n_prompt"></span>
      </button>
      <button class="nav-btn" data-tab="feed">
        <svg viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>
        <span data-i18n="n_feed"></span>
      </button>
      <button class="nav-rec" id="btn-record">
        <span class="dot"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
        <span data-i18n="n_record"></span>
      </button>
      <button class="nav-btn" data-tab="profile">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span data-i18n="n_profile"></span>
      </button>
    </div>
  </nav>
</div>

<div id="sheet" class="sheet hidden">
  <div class="sheet-in">
    <h3 data-i18n="rec_title"></h3>
    <p data-i18n="rec_soon"></p>
    <button class="btn ghost" id="sheet-close" data-i18n="close"></button>
  </div>
</div>

<div id="edit-sheet" class="sheet hidden">
  <div class="sheet-in">
    <h3 data-i18n="edit_profile"></h3>
    <form id="edit-form" autocomplete="off">
      <div class="field"><label data-i18n="name"></label><input id="e-name" type="text" maxlength="40"></div>
      <div class="field"><label data-i18n="username"></label><input id="e-username" type="text" maxlength="20" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
      <div class="field"><label data-i18n="bio"></label><textarea id="e-bio" maxlength="200"></textarea></div>
      <div class="field"><label data-i18n="country"></label><input id="e-country" type="text" maxlength="40"></div>
      <div class="field"><label data-i18n="dm_priv"></label><select id="e-dm"><option value="friends" data-i18n="dm_friends"></option><option value="everyone" data-i18n="dm_everyone"></option></select></div>
      <div id="edit-msg" class="msg"></div>
      <button class="btn" id="edit-save" type="submit" data-i18n="save"></button>
      <button class="btn ghost" id="edit-cancel" type="button" data-i18n="close"></button>
    </form>
  </div>
</div>
<div id="rec-sheet" class="sheet hidden">
  <div class="sheet-in" style="text-align:start">
    <h3 data-i18n="rec_title" style="text-align:center"></h3>
    <div style="text-align:center">
      <div id="rec-time" style="font-size:36px;font-weight:700;margin:6px 0 12px">0:00</div>
      <button class="btn" id="rec-btn" type="button" data-i18n="rec_start"></button>
      <audio id="rec-prev" controls class="hidden" style="width:100%;margin-top:12px"></audio>
    </div>
    <div id="rec-form" class="hidden" style="margin-top:16px">
      <div class="field"><input id="r-cap" type="text" maxlength="120" data-i18n-ph="rec_cap"></div>
      <div class="field"><select id="r-cat"></select></div>
      <div class="field"><select id="r-lang"></select></div>
      <div class="field"><select id="r-country"></select></div>
      <label style="display:flex;gap:10px;align-items:center;margin:6px 0 12px"><input type="checkbox" id="r-anon"><span data-i18n="anon_toggle"></span></label>
      <div id="rec-msg" class="msg"></div>
      <button class="btn" id="rec-post" type="button" data-i18n="rec_post"></button>
    </div>
    <button class="btn ghost sm" id="rec-close" type="button" data-i18n="close" style="margin-top:14px"></button>
  </div>
</div>
<div id="cm-sheet" class="sheet hidden">
  <div class="sheet-in" style="height:80%;text-align:start">
    <h3 data-i18n="comments_h"></h3>
    <div id="cm-list"></div>
    <form id="cm-form" class="field" style="display:flex;gap:8px;margin-top:12px"><input id="cm-in" type="text" maxlength="300" data-i18n-ph="cm_ph" autocomplete="off" style="flex:1;min-width:0"><button class="btn" type="submit" data-i18n="send" style="width:auto;padding:0 18px;font-size:15px"></button></form>
    <button class="btn ghost sm" id="cm-close" type="button" data-i18n="close"></button>
  </div>
</div>
<div id="settings" class="sheet hidden">
  <div class="sheet-in" style="text-align:start">
    <h3 data-i18n="settings"></h3>
    <div class="muted" style="margin-bottom:8px" data-i18n="language"></div>
    <div class="langs" style="margin:0 0 22px;justify-content:flex-start" data-langs></div>
    <button class="btn danger" id="btn-logout" data-i18n="logout"></button>
    <button class="btn ghost sm" id="settings-close" data-i18n="close" style="margin-top:12px"></button>
  </div>
</div>
<div id="search" class="sheet hidden">
  <div class="sheet-in" style="height:90%;text-align:start">
    <form id="sr-form" class="field" style="display:flex;gap:8px"><input id="sr-q" type="search" data-i18n-ph="search_ph" autocomplete="off" style="flex:1;min-width:0"><button class="btn" type="submit" data-i18n="search_btn" style="width:auto;padding:0 18px;font-size:15px"></button></form>
    <div id="sr-recent"></div>
    <div id="sr-results"></div>
    <button class="btn ghost sm" id="sr-close" data-i18n="close" style="margin-top:20px"></button>
  </div>
</div>
<div id="people" class="sheet hidden">
  <div class="sheet-in" style="height:90%;text-align:start">
    <h3 data-i18n="people"></h3>
    
        <div class="sec-h" data-i18n="requests"></div><div id="pp-req"></div>
    <div class="sec-h" data-i18n="friends"></div><div id="pp-friends"></div>
    <div class="sec-h" data-i18n="blocked_list"></div><div id="pp-blocked"></div>
    <button class="btn ghost sm" id="pp-close" data-i18n="close" style="margin-top:20px"></button>
  </div>
</div>
<div id="user-sheet" class="sheet hidden"><div class="sheet-in" id="user-in" style="min-height:70%"></div></div>
<div id="toast" class="hidden"></div>

}

  lang = code;
  try { localStorage.setItem('talkia_lang', code); } catch(e) {}
  applyLang();
}

/* ---------- avatar upload ---------- */
function compressImage(file, maxSide, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const side = Math.min(img.width, img.height);
      const out = Math.min(maxSide, side);
      const c = document.createElement('canvas'); c.width = c.height = out;
      const sx = (img.width - side) / 2, sy = (img.height - side) / 2;
      c.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, out, out);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error('compress')), 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image')); };
    img.src = url;
  });
}
$('p-avatar').onclick = () => $('avatar-input').click();

$('avatar-input').onchange = async e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  toast(t('uploading'));
  try {
    const blob = await compressImage(file, 512, 0.85);
    const path = currentUser.id + '/avatar.jpg';
    const { error } = await sb.storage.from('images').upload(path, blob, { upsert: true, contentType: 'image/jpeg' });
    if (error) throw error;
    const { data } = sb.storage.from('images').getPublicUrl(path);
    const url = data.publicUrl + '?v=' + Date.now();
    const { error: e2 } = await sb.from('profiles').update({ avatar_url: url }).eq('id', currentUser.id);
    if (e2) throw e2;
    await loadProfile();
    toast(t('saved'));
  } catch (err) {
    toast(t('upload_fail') + (err.message || err));
  }
};

const PCOLS = 'id,display_name,username,avatar_url,bio,country';
const uav = p => '<div class="uav">' + (p.avatar_url ? '<img alt="" src="' + esc(p.avatar_url) + '">' : esc((p.display_name || 'T').trim().charAt(0).toUpperCase())) + '</div>';
const urow = p => '<div class="urow" data-uid="' + esc(p.id) + '">' + uav(p) + '<div class="uinfo"><div>' + esc(p.display_name || t('user')) + '</div><div class="muted" style="font-size:13px">' + (p.username ? '@' + esc(p.username) : '') + (p.country ? ' · ' + esc(p.country) : '') + '</div></div></div>';
let rel = { fr: [], blocks: [], profiles: {} };

async function loadRelations() {
  const me = currentUser.id;
  const [a, b] = await Promise.all([
    sb.from('friendships').select('*').or('requester_id.eq.' + me + ',addressee_id.eq.' + me),
    sb.from('blocks').select('*').eq('blocker_id', me)]);
  rel.fr = a.data || []; rel.blocks = b.data || [];
  const ids = new Set();
  rel.fr.forEach(f => { ids.add(f.requester_id); ids.add(f.addressee_id); });
  rel.blocks.forEach(x => ids.add(x.blocked_id));
  ids.delete(me);
  rel.profiles = {};
  if (ids.size) {
    const { data } = await sb.from('profiles').select(PCOLS).in('id', [...ids]);
    (data || []).forEach(p => rel.profiles[p.id] = p);
  }
}
function relOf(uid) {
  const me = currentUser.id;
  if (rel.blocks.some(b => b.blocked_id === uid)) return { s: 'blocked' };
  const f = rel.fr.find(f => (f.requester_id === uid && f.addressee_id === me) || (f.requester_id === me && f.addressee_id === uid));
  if (!f || f.status === 'declined') return { s: 'none', f };
  if (f.status === 'accepted') return { s: 'friends', f };
  return { s: f.requester_id === me ? 'sent' : 'received', f };
}
async function renderPeople() {
  await loadRelations();
  const me = currentUser.id;
  const other = f => rel.profiles[f.requester_id === me ? f.addressee_id : f.requester_id];
  const list = arr => arr.length ? arr.map(urow).join('') : '<div class="muted">' + esc(t('none_yet')) + '</div>';
  $('pp-req').innerHTML = list(rel.fr.filter(f => f.status === 'pending' && f.addressee_id === me).map(other).filter(Boolean));
  $('pp-friends').innerHTML = list(rel.fr.filter(f => f.status === 'accepted').map(other).filter(Boolean));
  $('pp-blocked').innerHTML = list(rel.blocks.map(b => rel.profiles[b.blocked_id]).filter(Boolean));
}

async function doSearch() {
  const raw = $('sr-q').value.trim(), q = raw.replace(/[,()%*\\]/g, ' ').trim(), box = $('sr-results');
  if (q.length < 2) { box.innerHTML = '<div class="muted">' + esc(t('min2')) + '</div>'; return; }
  $('sr-recent').innerHTML = '';
  box.innerHTML = '<div class="muted">' + esc(t('loading')) + '</div>';
  setHist([raw, ...getHist().filter(x => x !== raw)]);
  const [pp, vp] = await Promise.all([
    sb.from('profiles').select(PCOLS).or('display_name.ilike.%' + q + '%,username.ilike.%' + q + '%').neq('id', currentUser.id).limit(15),
    sb.from('voice_posts').select('*').or('caption.ilike.%' + q + '%,country.ilike.%' + q + '%,language.ilike.%' + q + '%').order('created_at', { ascending: false }).limit(15)]);
  const people = pp.data || [], posts = vp.data || [];
  if (!people.length && !posts.length) { box.innerHTML = '<div class="muted">' + esc(t('no_results')) + '</div>'; return; }

}

$('search').onclick = e => {
  if (e.target.id === 'search') { $('search').classList.add('hidden'); return; }
  if (e.target.id === 'sr-clear') { setHist([]); renderHist(); return; }
  const h = e.target.closest('[data-q]');
  if (h) { $('sr-q').value = h.dataset.q; doSearch(); return; }
  const row = e.target.closest('.urow[data-uid]');
  if (row) openUser(row.dataset.uid);
};

async function openUser(uid) {
  const { data: p } = await sb.from('profiles').select(PCOLS).eq('id', uid).maybeSingle();
  if (!p) return;
  const r = relOf(uid);
  const b = (a, k, cls) => '<button class="btn sm ' + (cls || '') + '" data-act="' + a + '">' + esc(t(k)) + '</button>';
  let btns = '';
  if (r.s === 'none') btns += b('add', 'add_friend');
  if (r.s === 'sent') btns += b('cancel', 'cancel_req', 'ghost');
  if (r.s === 'received') btns += b('accept', 'accept') + b('decline', 'decline', 'ghost');
  if (r.s === 'friends') btns += b('unfriend', 'unfriend', 'ghost');
  btns += r.s === 'blocked' ? b('unblock', 'unblock', 'ghost') : b('block', 'block', 'danger');
  btns += b('report', 'report', 'danger');
  $('user-in').innerHTML = '<div class="avatar" style="cursor:default">' + (p.avatar_url ? '<img alt="" src="' + esc(p.avatar_url) + '">' : esc((p.display_name || 'T').trim().charAt(0).toUpperCase())) + '</div>'
    + '<h3>' + esc(p.display_name || t('user')) + '</h3><div class="muted">' + (p.username ? '@' + esc(p.username) : '') + '</div>'
    + (p.country ? '<div class="p-meta"><span class="tag">' + esc(p.country) + '</span></div>' : '')
    + (p.bio ? '<p class="p-bio">' + esc(p.bio) + '</p>' : '')
    + '<div data-uid="' + esc(uid) + '" id="user-btns">' + btns + '</div>'
    + '<button class="btn ghost sm" id="user-close">' + esc(t('close')) + '</button>';
  $('user-sheet').classList.remove('hidden');
}
$('user-sheet').onclick = async e => {
  if (e.target.id === 'user-sheet' || e.target.id === 'user-close') { $('user-sheet').classList.add('hidden'); return; }
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const uid = $('user-btns').dataset.uid, a = btn.dataset.act, me = currentUser.id, r = relOf(uid);
  btn.disabled = true;
  let res = {};
  try {
    if (a === 'add') res = await sb.from('friendships').insert({ requester_id: me, addressee_id: uid, status: 'pending' });
    else if (a === 'accept') res = await sb.from('friendships').update({ status: 'accepted' }).eq('id', r.f.id);
    else if (a === 'decline') res = await sb.from('friendships').update({ status: 'declined' }).eq('id', r.f.id);
    else if (a === 'cancel' || a === 'unfriend') res = await sb.from('friendships').delete().eq('id', r.f.id);
    else if (a === 'block') {
      res = await sb.from('blocks').insert({ blocker_id: me, blocked_id: uid });
      if (!res.error && r.f) await sb.from('friendships').delete().eq('id', r.f.id);
    }
    else if (a === 'unblock') res = await sb.from('blocks').delete().eq('blocker_id', me).eq('blocked_id', uid);
    else if (a === 'report') {
      const reason = prompt(t('report_ask'));
      if (reason === null) { btn.disabled = false; return; }
      res = await sb.from('reports').insert({ reporter_id: me, target_type: 'profile', target_id: uid, reason: reason.trim() || '-' });
    }
    if (res.error) throw res.error;
    toast(a === 'report' ? t('reported') : t('done'));
    await renderPeople();
    if (a === 'report') $('user-sheet').classList.add('hidden'); else openUser(uid);
  } catch (err) {
    btn.disabled = false;
    toast(t('err') + (err.message || err));
  }
};

/* ---------- tabs ---------- */
function showTab(name) {
  currentTab = name;
  document.querySelectorAll('.tab').forEach(s => s.classList.toggle('active', s.id === 'tab-' + name));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  if (name === 'prompt') loadPrompt();
  if (name === 'feed') loadFeed();
  if (name === 'profile') renderProfile();
  document.querySelector('main').scrollTop = 0;
}
document.querySelectorAll('.nav-btn').forEach(b => b.onclick = () => showTab(b.dataset.tab));

// ইনবক্স ও বেল আইকন ডাইনামিক হ্যান্ডলার (Batch 4)
$('btn-inbox').onclick = function() {
  if (typeof openCreateGroupModal === 'function') {
    openCreateGroupModal();
  } else if (window.openCreateGroupModal) {
    window.openCreateGroupModal();
  } else {
    toast(t('soon'));
  }
};

$('btn-bell').onclick = function() {
  if (typeof openNotificationsList === 'function') {
    openNotificationsList();
  } else if (window.openNotificationsList) {
    window.openNotificationsList();
  } else {
    toast(t('soon'));
  }
};

function todayISO() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
async function loadPrompt() {
  const el = $('prompt-text');
  const { data } = await sb.from('daily_prompts').select('*').eq('prompt_date', todayISO()).maybeSingle();
  if (!data) { el.textContent = t('no_prompt'); return; }
  const field = { bn: 'text_bn', en: 'text_en', ar: 'text_ar' }[lang];
  el.textContent = data[field] || data.text_bn;
}


/* ---------- categories ---------- */
let cats = [];
async function loadCats() {
  if (cats.length) return;
  const { data } = await sb.from('categories').select('*').order('id');
  cats = data || [];
}
const catName = c => c['name_' + lang] || c.name_en || c.slug;
const COUNTRIES = ['BD', 'IN', 'SA', 'AE', 'GLOBAL'];
const opts = (arr, val, label) => arr.map(x => '<option value="' + esc(val(x)) + '">' + esc(label(x)) + '</option>').join('');

/* ---------- recording ---------- */
let mr = null, chunks = [], recBlob = null, recSecs = 0, recTimer = null, recStream = null;
const pickMime = () => ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/aac'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
const fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
function resetRec() {
  clearInterval(recTimer);
  if (recStream) recStream.getTracks().forEach(x => x.stop());
  if (mr && mr.state === 'recording') { mr.onstop = null; try { mr.stop(); } catch (e) {} }
  mr = null; chunks = []; recBlob = null; recSecs = 0; recStream = null;
  $('rec-time').textContent = '0:00'; $('rec-btn').textContent = t('rec_start'); $('rec-btn').classList.remove('danger');
  $('rec-prev').classList.add('hidden'); $('rec-prev').removeAttribute('src'); $('rec-form').classList.add('hidden'); $('rec-msg').textContent = '';
}
async function openRec(caption) {
  resetRec(); await loadCats();
  $('r-cap').value = caption || '';
  $('r-cat').innerHTML = opts(cats, c => c.id, catName);
  $('r-lang').innerHTML = opts(['bn', 'en', 'ar'], x => x, x => t('l_' + x)); $('r-lang').value = lang;
  $('r-country').innerHTML = opts(COUNTRIES, x => x, x => t('c_' + x)); $('r-country').value = 'BD';
  $('r-anon').checked = false;
  $('rec-sheet').classList.remove('hidden');
}
$('btn-record').onclick = () => openRec('');
$('prompt-answer').onclick = () => openRec('#TalkiaToday');
$('rec-close').onclick = () => { resetRec(); $('rec-sheet').classList.add('hidden'); };
$('rec-btn').onclick = async () => {
  const msg = $('rec-msg');
  if (mr && mr.state === 'recording') { mr.stop(); return; }
  resetRec();
  try {
    recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mime = pickMime();
    mr = mime ? new MediaRecorder(recStream, { mimeType: mime }) : new MediaRecorder(recStream);
    mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = () => {
      clearInterval(recTimer);
      recStream.getTracks().forEach(x => x.stop());
      recBlob = new Blob(chunks, { type: mr.mimeType || mime || 'audio/webm' });
      $('rec-prev').src = URL.createObjectURL(recBlob); $('rec-prev').classList.remove('hidden');
      $('rec-form').classList.remove('hidden'); $('rec-btn').textContent = t('rec_again'); $('rec-btn').classList.remove('danger');
    };
    mr.start();
    $('rec-btn').textContent = t('rec_stop'); $('rec-btn').classList.add('danger');
    recTimer = setInterval(() => { recSecs++; $('rec-time').textContent = fmt(recSecs); if (recSecs >= 60) mr.stop(); }, 1000);
  } catch (err) { msg.className = 'msg'; msg.textContent = t('mic_err'); }
};
$('rec-post').onclick = async () => {
  const msg = $('rec-msg'); msg.className = 'msg'; msg.textContent = '';
  if (!recBlob || recSecs < 3) { msg.textContent = t('too_short'); return; }
  if (recBlob.size > 2 * 1024 * 1024) { msg.textContent = t('too_big'); return; }
  $('rec-post').disabled = true;
  try {
    const ty = recBlob.type.split(';')[0], ext = ty.includes('mp4') ? 'm4a' : ty.includes('aac') ? 'aac' : 'webm';
    const path = currentUser.id + '/' + Date.now() + '.' + ext;
    const up = await sb.storage.from('audio').upload(path, recBlob, { contentType: ty });
    if (up.error) throw up.error;
    const url = sb.storage.from('audio').getPublicUrl(path).data.publicUrl;
    const { error } = await sb.from('voice_posts').insert({
      user_id: currentUser.id, audio_url: url, duration_seconds: recSecs, caption: $('r-cap').value.trim() || null,
      category_id: Number($('r-cat').value) || null, language: $('r-lang').value, country: $('r-country').value, is_anonymous: $('r-anon').checked });
    if (error) throw error;
    resetRec(); $('rec-sheet').classList.add('hidden'); toast(t('posted')); showTab('feed');
  } catch (err) { msg.textContent = err.message || String(err); }
  finally { $('rec-post').disabled = false; }
};

/* ---------- feed ---------- */
let feedCat = '', feedCountry = '', feedPage = 0;
const PAGE = 10, playSvg = '<path d="M7 4l13 8-13 8z"/>', pauseSvg = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
function renderFilters() {
  $('feed-filters').innerHTML = '<div class="chips"><button class="chip' + (feedCat === '' ? ' on' : '') + '" data-cat="">' + esc(t('all')) + '</button>'
    + cats.map(c => '<button class="chip' + (String(c.id) === feedCat ? ' on' : '') + '" data-cat="' + c.id + '">' + esc(catName(c)) + '</button>').join('') + '</div>'
    + '<div class="chips"><button class="chip' + (feedCountry === '' ? ' on' : '') + '" data-country="">' + esc(t('all')) + '</button>'
    + COUNTRIES.map(c => '<button class="chip' + (c === feedCountry ? ' on' : '') + '" data-country="' + c + '">' + esc(t('c_' + c)) + '</button>').join('') + '</div>';
}
$('feed-filters').onclick = e => {
  const b = e.target.closest('.chip'); if (!b) return;
  if ('cat' in b.dataset) feedCat = b.dataset.cat; else feedCountry = b.dataset.country;
  loadFeed();
};
function cardHtml(p) {
  const c = cats.find(x => x.id === p.category_id);
  const nm = p.is_anonymous ? t('anon') : (p.display_name || t('user'));
  const av = p.is_anonymous ? '<div class="uav">?</div>' : uav({ display_name: p.display_name, avatar_url: p.avatar_url });
  return '<div class="card post" data-id="' + esc(p.id) + '"><div class="phead">' + av + '<div><div>' + esc(nm) + '</div><div class="muted" style="font-size:12px">' + new Date(p.created_at).toLocaleDateString() + '</div></div></div>'
    + '<div>' + (c ? '<span class="tag">' + esc(catName(c)) + '</span>' : '') + (p.country ? '<span class="tag">' + esc(t('c_' + p.country) === 'c_' + p.country ? p.country : t('c_' + p.country)) + '</span>' : '') + (p.language ? '<span class="tag">' + esc(p.language) + '</span>' : '') + '</div>'
    + (p.caption ? '<div style="margin-top:8px">' + esc(p.caption) + '</div>' : '')
    + '<div class="play"><i data-play="' + esc(p.audio_url) + '"><svg viewBox="0 0 24 24">' + playSvg + '</svg></i><div class="wave"><b></b></div><span class="muted" style="font-size:13px">' + esc(fmt(p.duration_seconds || 0)) + '</span></div>'
    + '<div class="acts"><button data-like="' + esc(p.id) + '" class="' + (p.liked ? 'on' : '') + '">' + (p.liked ? '♥' : '♡') + ' <span>' + Number(p.like_count) + '</span></button><button data-cm="' + esc(p.id) + '">💬 <span>' + Number(p.comment_count) + '</span></button></div></div>';
}
async function loadFeed(more) {
  await loadCats(); renderFilters();
  const box = $('feed-list');
  if (!more) { feedPage = 0; box.innerHTML = '<div class="empty">' + esc(t('loading')) + '</div>'; }
  let q = sb.from('voice_feed').select('*').order('created_at', { ascending: false }).range(feedPage * PAGE, feedPage * PAGE + PAGE - 1);
  if (feedCat) q = q.eq('category_id', Number(feedCat));
  if (feedCountry) q = q.eq('country', feedCountry);
  const { data, error } = await q;
  const old = $('feed-more'); if (old) old.remove();
  if (error) { box.innerHTML = '<div class="empty">' + esc(error.message) + '</div>'; return; }
  if (!more) box.innerHTML = '';
  if (!data.length && !more) { box.innerHTML = '<div class="empty"><div class="big">🎙️</div>' + esc(t('feed_empty')) + '</div>'; return; }
  box.insertAdjacentHTML('beforeend', data.map(cardHtml).join(''));
  if (data.length === PAGE) box.insertAdjacentHTML('beforeend', '<button class="btn ghost sm" id="feed-more">' + esc(t('more')) + '</button>');
}

/* ---------- player, likes, comments ---------- */
const audio = new Audio(); let activeIcon = null, activeBar = null;
function stopIcon() { if (activeIcon) activeIcon.querySelector('svg').innerHTML = playSvg; }
audio.ontimeupdate = () => { if (activeBar && audio.duration) activeBar.style.width = (audio.currentTime / audio.duration * 100) + '%'; };
audio.onended = () => { stopIcon(); if (activeBar) activeBar.style.width = '0'; };
$('feed-list').onclick = async e => {
  if (e.target.closest('#feed-more')) { feedPage++; loadFeed(true); return; }
  const pl = e.target.closest('[data-play]');
  if (pl) {
    if (activeIcon === pl && !audio.paused) { audio.pause(); stopIcon(); return; }
    if (activeIcon !== pl) { stopIcon(); if (activeBar) activeBar.style.width = '0'; activeIcon = pl; activeBar = pl.parentNode.querySelector('.wave b'); audio.src = pl.dataset.play; }
    audio.play().then(() => { pl.querySelector('svg').innerHTML = pauseSvg; }).catch(() => toast(t('err') + 'audio'));
    return;
  }
  const lk = e.target.closest('[data-like]');
  if (lk) {
    const id = lk.dataset.like, on = lk.classList.contains('on'), sp = lk.querySelector('span');
    const res = on ? await sb.from('likes').delete().eq('user_id', currentUser.id).eq('voice_post_id', id)
                   : await sb.from('likes').insert({ user_id: currentUser.id, voice_post_id: id });
    if (res.error) { toast(t('err') + res.error.message); return; }
    lk.classList.toggle('on', !on); sp.textContent = Math.max(0, Number(sp.textContent) + (on ? -1 : 1));
    lk.firstChild.textContent = (on ? '♡' : '♥') + ' ';
    return;
  }
  const cm = e.target.closest('[data-cm]');
  if (cm) openComments(cm.dataset.cm, cm.querySelector('span'));
};
let cmPost = null, cmSpan = null;
async function loadComments() {
  const { data, error } = await sb.from('comment_feed').select('*').eq('voice_post_id', cmPost).order('created_at', { ascending: true }).limit(50);
  $('cm-list').innerHTML = error ? esc(error.message) : (data.length ? data.map(c => '<div class="cm"><b>' + esc(c.display_name || t('user')) + '</b><div>' + esc(c.body || '') + '</div></div>').join('') : '<div class="muted">' + esc(t('none_yet')) + '</div>');
}
function openComments(id, span) { cmPost = id; cmSpan = span; $('cm-list').innerHTML = ''; $('cm-sheet').classList.remove('hidden'); loadComments(); }
$('cm-close').onclick = () => $('cm-sheet').classList.add('hidden');
$('cm-sheet').onclick = e => { if (e.target.id === 'cm-sheet') $('cm-sheet').classList.add('hidden'); };
$('cm-form').onsubmit = async e => {
  e.preventDefault();
  const body = $('cm-in').value.trim(); if (!body) return;
  const { error } = await sb.from('comments').insert({ user_id: currentUser.id, voice_post_id: cmPost, body });
  if (error) { toast(t('err') + error.message); return; }
  $('cm-in').value = ''; if (cmSpan) cmSpan.textContent = Number(cmSpan.textContent) + 1;
  loadComments();
};

applyLang();
setMode('login');
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
