<!doctype html>
<html lang="bn" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talkia</title>
<meta name="theme-color" content="#0a0d14">
<meta name="description" content="Talkia - The Voice Universe">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/glassmorphism.css">
<link rel="stylesheet" href="css/feed.css">
<link rel="stylesheet" href="css/chat.css">

</head>
<body>

<section id="auth" class="hidden">
  <div class="auth-card">
    <div class="brand">
      <div class="badge"><img src="logo-wordmark.png" alt="Talkia"></div>
      <div class="bn-name">টকিয়া</div>
      <p data-i18n="tagline"></p>
    </div>
    <div class="seg">
      <button id="mode-login" class="on" data-i18n="login"></button>
      <button id="mode-signup" data-i18n="signup"></button>
    </div>
    <form id="auth-form" autocomplete="on">
      <div class="field hidden" id="name-field"><input id="name" type="text" data-i18n-ph="name" autocomplete="name"></div>
      <div class="field"><input id="email" type="email" data-i18n-ph="email" autocomplete="email" required></div>
      <div class="field"><input id="password" type="password" data-i18n-ph="password" autocomplete="current-password" minlength="6" required></div>
      <div id="auth-msg" class="msg"></div>
      <button class="btn" id="auth-submit" type="submit" data-i18n="login"></button>
    </form>
    <div class="langs" data-langs></div>
  </div>
</section>

<div id="app" class="hidden">
  <header>
    <div class="hbadge"><img src="logo-wordmark.png" alt="Talkia"></div>
    <div class="hdr-actions">
      <button class="icon-btn" id="btn-inbox" aria-label="Inbox">
        <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.5 7.2L3 21l1.8-5.5A8 8 0 1 1 21 12z"/></svg>
      </button>
      <button class="icon-btn" id="btn-bell" aria-label="Notifications">
        <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10.3 20a2 2 0 0 0 3.4 0"/></svg>
      </button>
      <button class="icon-btn" id="btn-search" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" aria-label="Settings" onclick="openSettingsModal()">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l-.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section id="tab-home" class="tab active">
      <h2 data-i18n="t_home"></h2>
      <div class="filter-row">
        <select id="feed-cat-select">
          <option value="" data-i18n="all_cats"></option>
        </select>
        <select id="feed-country-select">
          <option value="" data-i18n="all_countries"></option>
        </select>
      </div>
      <div id="feed-list"></div>
    </section>

    <section id="tab-prompt" class="tab">
      <h2 data-i18n="t_prompt"></h2>
      <div class="card">
        <span class="tag">#TalkiaToday</span>
        <div class="prompt-text" id="prompt-text">...</div>
        <button class="btn" id="prompt-answer" data-i18n="answer_prompt"></button>
      </div>
    </section>

    <section id="tab-groups" class="tab">
      <h2 data-i18n="t_groups"></h2>
      <div class="card">
        <p class="muted" style="font-size:14px; margin-bottom:12px;" data-i18n="g_desc"></p>
        <button class="btn" id="btn-create-room" data-i18n="g_create_btn">+ নতুন রুম তৈরি করুন</button>
      </div>
      <div id="group-rooms-list"></div>
    </section>

    <section id="tab-profile" class="tab">
      <div class="profile-card">
        <div class="cover-box">
          <img id="p-cover-img" src="" class="hidden">
          <button class="visitor-btn" id="btn-visitors" title="Visitors">👁️‍🗨️</button>
          <input type="file" id="cover-input" accept="image/*" class="hidden">
        </div>

        <div class="profile-top">
          <div class="avatar" id="p-avatar">T</div>
          <input type="file" id="avatar-input" accept="image/*" class="hidden">
          
          <h2 id="p-name"></h2>
          <div class="muted" id="p-username"></div>
          <div class="p-meta" id="p-country"></div>
          <p class="p-bio" id="p-bio"></p>

          <div class="ext-bio-box">
            <div><b data-i18n="lbl_edu"></b> <span id="p-edu"></span></div>
            <div><b data-i18n="lbl_rel"></b> <span id="p-rel"></span></div>
            <div><b data-i18n="lbl_relig"></b> <span id="p-relig"></span></div>
            <div><b data-i18n="lbl_hobby"></b> <span id="p-hobby"></span></div>
            <div><b data-i18n="lbl_city"></b> <span id="p-city"></span></div>
          </div>

          <div style="display:flex; gap:8px; justify-content:center; margin-top:14px;">
            <button class="btn ghost" id="btn-edit" data-i18n="edit_profile" style="margin:0"></button>
            <button class="btn ghost" id="btn-people" data-i18n="people" style="margin:0"></button>
          </div>

          <div class="profile-tabs">
            <button type="button" class="profile-tab-btn on" id="ptab-posts-btn" data-i18n="posts_tab" onclick="switchProfileTab('posts')"></button>
            <button type="button" class="profile-tab-btn" id="ptab-photos-btn" data-i18n="photos_tab" onclick="switchProfileTab('photos')"></button>
          </div>

          <div id="profile-posts-area" style="margin-top:14px; text-align:left;"></div>
          <div id="profile-photos-area" class="hidden" style="margin-top:14px; display:grid; grid-template-columns:repeat(3, 1fr); gap:6px;"></div>
        </div>
      </div>
    </section>
  </main>

  <nav>
    <div class="nav-in">
      <button class="nav-btn on" data-tab="home">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span data-i18n="n_home"></span>
      </button>
      <button class="nav-btn" data-tab="prompt">
        <svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6L12 16.7 6.7 19.6l1.1-6L3.4 9.4l6-.8z"/></svg>
        <span data-i18n="n_prompt"></span>
      </button>
      <button class="nav-rec" id="btn-record">
        <span class="dot"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
        <span data-i18n="n_record"></span>
      </button>
      <button class="nav-btn" data-tab="groups">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span data-i18n="n_groups"></span>
      </button>
      <button class="nav-btn" data-tab="profile">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span data-i18n="n_profile"></span>
      </button>
    </div>
  </nav>
</div>

<!-- Sheets & Modals -->
<div id="inbox-sheet" class="sheet hidden">
  <div class="sheet-in" style="height:85%; text-align:start; display:flex; flex-direction:column;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3 style="margin:0;" data-i18n="inbox_title"></h3>
      <button id="inbox-sheet-close" style="color:#8b97b3; font-size:20px; border:0; background:none; cursor:pointer;">✕</button>
    </div>
    <div id="inbox-list" style="flex:1; overflow-y:auto; margin-bottom:12px;"></div>
    <button class="btn ghost sm" id="inbox-close-btn" style="width:100%; margin-top:auto;" data-i18n="btn_back"></button>
  </div>
</div>

<div id="notif-sheet" class="sheet hidden">
  <div class="sheet-in" style="height:85%; text-align:start; display:flex; flex-direction:column;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3 style="margin:0;" data-i18n="notif_title"></h3>
      <button id="notif-sheet-close" style="color:#8b97b3; font-size:20px; border:0; background:none; cursor:pointer;">✕</button>
    </div>
    <div id="notif-list" style="flex:1; overflow-y:auto; margin-bottom:12px;"></div>
    <button class="btn ghost sm" id="notif-close-btn" style="width:100%; margin-top:auto;" data-i18n="btn_back"></button>
  </div>
</div>

<div id="edit-sheet" class="sheet hidden">
  <div class="sheet-in">
    <h3 data-i18n="edit_profile"></h3>
    <form id="edit-form" autocomplete="off">
      <div class="field"><label data-i18n="name"></label><input id="e-name" type="text" maxlength="40"></div>
      <div class="field"><label data-i18n="username"></label><input id="e-username" type="text" maxlength="20" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
      <div class="field"><label data-i18n="bio"></label><textarea id="e-bio" maxlength="200"></textarea></div>
      <div class="field"><label data-i18n="lbl_edu"></label><input id="e-edu" type="text" maxlength="60"></div>
      <div class="field"><label data-i18n="lbl_rel"></label><input id="e-rel" type="text" maxlength="40"></div>
      <div class="field"><label data-i18n="lbl_relig"></label><input id="e-relig" type="text" maxlength="40"></div>
      <div class="field"><label data-i18n="lbl_hobby"></label><input id="e-hobby" type="text" maxlength="60"></div>
      <div class="field"><label data-i18n="lbl_city"></label><input id="e-city" type="text" maxlength="50"></div>
      <div class="field"><label data-i18n="country"></label><input id="e-country" type="text" maxlength="40"></div>
      <div id="edit-msg" class="msg"></div>
      <button class="btn" id="edit-save" type="submit" data-i18n="save"></button>
      <button class="btn ghost" id="edit-cancel" type="button" data-i18n="btn_back"></button>
    </form>
  </div>
</div>

<div id="rec-sheet" class="sheet hidden">
  <div class="sheet-in" style="text-align:start">
    <h3 data-i18n="rec_title" style="text-align:center"></h3>
    
    <div style="display:flex; gap:6px; margin-bottom:14px; background:var(--surface2); padding:4px; border-radius:10px;">
      <button type="button" id="ptype-text" style="flex:1; padding:8px; border-radius:8px; font-size:13px; font-weight:600; background:var(--accent); color:#fff;" data-i18n="lbl_text"></button>
      <button type="button" id="ptype-voice" style="flex:1; padding:8px; border-radius:8px; font-size:13px; font-weight:600; color:var(--muted);" data-i18n="lbl_voice"></button>
      <button type="button" id="ptype-image" style="flex:1; padding:8px; border-radius:8px; font-size:13px; font-weight:600; color:var(--muted);" data-i18n="lbl_image"></button>
    </div>

    <div id="text-post-area" style="margin-bottom:12px;">
      <div class="field"><textarea id="r-text-content" maxlength="500" data-i18n-ph="post_ph" style="min-height:110px; width:100%; padding:14px; border-radius:12px; background:var(--surface); border:1px solid var(--line); color:var(--text); outline:none;"></textarea></div>
    </div>

    <div id="voice-rec-area" class="hidden" style="text-align:center">
      <div id="rec-time" style="font-size:36px;font-weight:700;margin:6px 0 12px">0:00</div>
      <button class="btn" id="rec-btn" type="button" data-i18n="rec_start"></button>
      <audio id="rec-prev" controls class="hidden" style="width:100%;margin-top:12px"></audio>
    </div>

    <div id="image-upload-area" class="hidden" style="margin-bottom:12px; text-align:center;">
      <input type="file" id="post-img-file" accept="image/*" class="field">
    </div>

    <div id="rec-form" style="margin-top:12px">
      <div class="field"><select id="r-cat"></select></div>
      <div class="field"><select id="r-lang"></select></div>
      <div class="field"><select id="r-country"></select></div>
      <label style="display:flex;gap:10px;align-items:center;margin:6px 0 12px"><input type="checkbox" id="r-anon"><span data-i18n="anon_toggle"></span></label>
      <div id="rec-msg" class="msg"></div>
      <button class="btn" id="rec-post" type="button" data-i18n="rec_post"></button>
    </div>
    <button class="btn ghost sm" id="rec-close" type="button" data-i18n="btn_cancel" style="margin-top:14px"></button>
  </div>
</div>

<div id="cm-sheet" class="sheet hidden">
  <div class="sheet-in" style="height:80%;text-align:start">
    <h3 data-i18n="comments_h"></h3>
    <div id="cm-list"></div>
    <form id="cm-form" class="field" style="display:flex;gap:8px;margin-top:12px"><input id="cm-in" type="text" maxlength="300" data-i18n-ph="cm_ph" autocomplete="off" style="flex:1;min-width:0"><button class="btn" type="submit" data-i18n="send" style="width:auto;padding:0 18px;font-size:15px"></button></form>
    <button class="btn ghost sm" id="cm-close" type="button" data-i18n="btn_back"></button>
  </div>
</div>

<div id="search" class="sheet hidden"><div class="sheet-in" style="height:85%;text-align:start;display:flex;flex-direction:column">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0" data-i18n="search_btn"></h3><button id="sr-close" style="font-size:20px;color:var(--muted)">✕</button></div>
<form id="sr-form" style="display:flex;gap:8px"><input id="sr-q" data-i18n-ph="search_ph" autocomplete="off" style="flex:1;min-width:0;padding:12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);outline:none"><button class="btn" type="submit" style="width:auto" data-i18n="search_btn"></button></form>
<div id="sr-results" style="flex:1;overflow-y:auto;margin-top:12px"></div></div></div>
<div id="people" class="sheet hidden"><div class="sheet-in" style="height:85%;text-align:start">
<div style="display:flex;justify-content:space-between;align-items:center"><h3 data-i18n="people"></h3><button id="pp-close" style="font-size:20px;color:var(--muted)">✕</button></div>
<h4 data-i18n="requests"></h4><div id="pp-req"></div><h4 data-i18n="friends"></h4><div id="pp-friends"></div><h4 data-i18n="blocked_list"></h4><div id="pp-blocked"></div></div></div>
<div id="toast" class="hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/utils/dom.js"></script>
<script src="js/utils/time-formatter.js"></script>
<script src="js/utils/audio-effects.js"></script>
<script src="js/modules/i18n-language.js"></script>
<script src="js/modules/auth.js"></script>
<script src="js/modules/profile.js"></script>
<script src="js/modules/feed.js"></script>
<script src="js/modules/audio-recorder.js"></script>
<script src="js/modules/chat-inbox.js"></script>
<script src="js/modules/voice-rooms.js"></script>
<script src="js/modules/privacy-settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
