<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talkia</title>
<meta name="theme-color" content="#0a0d14">
<meta name="description" content="Talkia - The Voice Universe">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000; --surface:#121212; --surface2:#262626; --line:#262626;
  --text:#f5f5f5; --muted:#a8a8a8; --accent:#0095f6; --accent-text:#e0f1ff; --accent-ink:#ffffff; --danger:#ed4956;
  --nav-h:60px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Inter","Hind Siliguri",system-ui,-apple-system,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none !important}

#auth{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px 20px;background:var(--bg)}
.auth-card{width:100%;max-width:380px}
.brand{text-align:center;margin-bottom:24px}
.brand .badge{display:inline-block;background:#fff;border-radius:20px;padding:14px 24px;box-shadow:0 8px 30px rgba(0,0,0,0.5)}
.brand .badge img{height:52px;display:block}
.bn-name{margin-top:12px;font-size:22px;font-weight:700;letter-spacing:-0.5px;color:var(--text)}
.hbadge{display:flex;background:#fff;border-radius:8px;padding:4px 10px}
.hbadge img{height:22px;display:block}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px;margin-bottom:16px}
.seg button{padding:10px;border-radius:6px;color:var(--muted);font-weight:600;font-size:14px}
.seg button.on{background:var(--surface2);color:var(--text)}
.field{margin-bottom:12px}
.field label{display:block;margin-bottom:4px;font-size:12px;color:var(--muted);font-weight:500}
.field input,.field textarea,.field select{width:100%;padding:12px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--line);outline:none;color:var(--text);font-size:14px}
.field textarea{resize:none;min-height:80px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#737373}
.btn{width:100%;padding:12px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.msg{min-height:20px;margin:8px 0;font-size:13px;text-align:center;color:var(--danger)}
.msg.ok{color:#4ade80}
.langs{display:flex;gap:8px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.langs button{padding:6px 12px;border-radius:20px;border:1px solid var(--line);color:var(--muted);font-size:13px}
.langs button.on{border-color:var(--text);color:var(--text)}

#app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative;background:var(--bg);box-shadow:0 0 20px rgba(0,0,0,0.8)}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:20}
.hdr-actions{display:flex;gap:12px}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:transparent}
.icon-btn svg{width:24px;height:24px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;overflow-y:auto;padding:12px 0 calc(var(--nav-h) + env(safe-area-inset-bottom) + 20px)}
.tab{display:none}.tab.active{display:block}
h2{margin:0 0 12px;font-size:18px;font-weight:600;padding:0 16px}
.card{background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;margin-bottom:0}
.muted{color:var(--muted)}
.tag{display:inline-block;background:var(--surface2);color:var(--text);border-radius:6px;padding:2px 8px;font-size:12px;margin-inline-end:6px;font-weight:500}
.prompt-text{font-size:18px;line-height:1.4;margin:10px 0 16px;font-weight:500}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .big{font-size:36px;margin-bottom:8px}
.post .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:8px}
.post .play{display:flex;align-items:center;gap:10px;margin-top:10px;background:var(--surface);padding:8px 12px;border-radius:8px}
.post .play i{width:36px;height:36px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.post .play i svg{width:14px;height:14px;fill:var(--accent-ink)}
.post .wave{flex:1;height:24px;background:repeating-linear-gradient(90deg,var(--line) 0 3px,transparent 3px 6px);border-radius:4px;opacity:.8}

/* Instagram Style Profile Layout */
.profile-card{background:var(--bg);margin-bottom:10px}
.cover-box{height:0;background:transparent;position:relative;display:none}
.visitor-btn{position:absolute;top:10px;right:16px;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);color:#fff;font-size:16px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,0.15);cursor:pointer;z-index:10}

.profile-top{padding:16px;text-align:left}
.profile-header-ig{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.avatar{width:82px;height:82px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:30px;font-weight:700;color:var(--text);position:relative;overflow:hidden;cursor:pointer;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}

.profile-stats-ig{display:flex;flex:1;justify-content:space-around;text-align:center;margin-left:16px}
.stat-num{font-weight:700;font-size:16px;color:var(--text);display:block}
.stat-lbl{font-size:12px;color:var(--muted)}

.profile-bio-section{margin-bottom:14px}
.profile-bio-section h2{margin:0 0 4px;font-size:16px;padding:0;font-weight:600}
.p-username{font-size:13px;color:var(--muted);margin-bottom:6px}
.p-bio{font-size:13px;line-height:1.4;margin:6px 0;color:var(--text)}
.p-meta{margin-top:4px}

.uav, .avatar-small { width:34px !important; height:34px !important; min-width:34px !important; min-height:34px !important; border-radius:50% !important; object-fit:cover !important; flex-shrink:0 !important; background:var(--surface2); display:grid; place-items:center; font-weight:600; color:var(--text); overflow:hidden; position:relative; }
.uav img { width:100% !important; height:100% !important; object-fit:cover !important; }

.ext-bio-box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:10px;text-align:left;font-size:12px;display:flex;flex-direction:column;gap:4px}
.ext-bio-box div{display:flex;align-items:center;gap:6px;color:var(--muted)}
.ext-bio-box span{color:var(--text)}

.profile-actions-ig{display:flex;gap:8px;margin-bottom:16px}
.profile-actions-ig .btn{flex:1;padding:8px 12px;font-size:13px;font-weight:600;border-radius:8px}

.profile-tabs{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:10px}
.profile-tab-btn{flex:1;font-weight:600;font-size:13px;color:var(--muted);padding:12px;cursor:pointer;text-align:center;background:none;border:0;display:flex;align-items:center;justify-content:center;gap:6px}
.profile-tab-btn.on{color:var(--text);border-bottom:1.5px solid var(--text);margin-bottom:-1px}

#profile-posts-area{margin-top:2px; text-align:left;}
#profile-photos-area{margin-top:2px; display:grid; grid-template-columns:repeat(3, 1fr); gap:2px;}
#profile-photos-area img {width:100%; aspect-ratio:1/1; object-fit:cover;}

.filter-row{display:flex;gap:8px;padding:0 16px 12px;background:var(--bg)}
.filter-row select{flex:1;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--text);outline:none;font-size:13px}

nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:center;pointer-events:none}
.nav-in{pointer-events:auto;width:100%;max-width:480px;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:var(--bg);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:10px;padding:6px 2px}
.nav-btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn.on{color:var(--text);stroke-width:2.2}
.nav-rec{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text);font-size:10px}
.nav-rec .dot{width:40px;height:40px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;border:1px solid var(--line)}
.nav-rec .dot svg{width:22px;height:22px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,0.7);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{width:100%;max-width:480px;max-height:85%;overflow-y:auto;background:var(--surface);border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));text-align:center;border-top:1px solid var(--line)}
.sheet-in h3{margin:0 0 8px;font-size:17px;font-weight:600}
.sheet-in p{color:var(--muted);margin:0 0 16px;font-size:13px}
.sheet-in form{text-align:start}
.sheet-in .btn{margin-top:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));z-index:40;
  background:var(--surface2);border:1px solid var(--line);padding:8px 14px;border-radius:8px;font-size:13px;max-width:90%}
</style>
</head>
<body>

<section id="auth" class="hidden">
  <div class="auth-card">
    <div class="brand">
      <div class="badge"><img src="logo-wordmark.png" alt="Talkia"></div>
      <div class="bn-name">Talkia</div>
      <p data-i18n="tagline"></p>
    </div>
    <div class="seg">
      <button id="mode-login" class="on" data-i18n="login"></button>
      <button id="mode-signup" data-i18n="signup"></button>
    </div>
    <form id="auth-form" autocomplete="on">
      <div class="field hidden" id="name-field"><input id="name" type="text" data-i18n-ph="name" autocomplete="name"></div>
      <div class="field"><input id="email" type="email" data-i18n-ph="email" autocomplete="email" required></div>
      <div class="field"><input id="password" type="password" data-i18n-ph="password" autocomplete="current-password" minlength="6" required></div>
      <div id="auth-msg" class="msg"></div>
      <button class="btn" id="auth-submit" type="submit" data-i18n="login"></button>
    </form>
    <div class="langs" data-langs></div>
  </div>
</section>

<div id="app" class="hidden">
  <header>
    <div class="hbadge"><img src="logo-wordmark.png" alt="Talkia"></div>
    <div class="hdr-actions">
      <button class="icon-btn" id="btn-inbox" aria-label="Inbox">
        <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      </button>
      <button class="icon-btn" id="btn-bell" aria-label="Notifications">
        <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
      </button>
      <button class="icon-btn" id="btn-search" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" aria-label="Settings" onclick="openSettingsModal()">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section id="tab-home" class="tab active">
      <div class="filter-row">
        <select id="feed-cat-select">
          <option value="" data-i18n="all_cats"></option>
        </select>
        <select id="feed-country-select">
          <option value="" data-i18n="all_countries"></option>
        </select>
      </div>
      <div id="feed-list"></div>
    </section>

    <section id="tab-prompt" class="tab">
      <h2 data-i18n="t_prompt"></h2>
      <div class="card" style="margin:16px; border:1px solid var(--line); border-radius:12px;">
        <span class="tag">#TalkiaToday</span>
        <div class="prompt-text" id="prompt-text">...</div>
        <button class="btn" id="prompt-answer" data-i18n="answer_prompt"></button>
      </div>
    </section>

    <section id="tab-groups" class="tab">
      <div style="padding:16px 16px 0;">
        <h2 data-i18n="t_groups" style="padding:0; margin-bottom:8px;"></h2>
        <div class="card" style="padding:12px; border:1px solid var(--line); border-radius:12px; margin-bottom:12px;">
          <p class="muted" style="font-size:13px; margin-bottom:10px;" data-i18n="g_desc"></p>
          <button class="btn" id="btn-create-room" onclick="openCreateGroupModal()" data-i18n="g_create_btn">+ Create Room</button>
        </div>
      </div>
      <div id="group-rooms-list"></div>
    </section>

    <section id="tab-profile" class="tab">
      <div class="profile-card">
        <div class="cover-box">
          <img id="p-cover-img" src="" class="hidden">
          <button class="visitor-btn" id="btn-visitors" title="Visitors">👁️‍🗨️</button>
          <input type="file" id="cover-input" accept="image/*" class="hidden">
        </div>

        <div class="profile-top">
          <div class="profile-header-ig">
            <div class="avatar" id="p-avatar">T</div>
            <input type="file" id="avatar-input" accept="image/*" class="hidden">
            <div class="profile-stats-ig">
              <div>
                <span class="stat-num" id="stat-posts">0</span>
                <span class="stat-lbl" data-i18n="posts_h">Posts</span>
              </div>
              <div>
                <span class="stat-num" id="stat-friends">0</span>
                <span class="stat-lbl" data-i18n="friends">Friends</span>
              </div>
              <div>
                <span class="stat-num" id="stat-views">0</span>
                <span class="stat-lbl" data-i18n="views_count">Views</span>
              </div>
            </div>
          </div>

          <div class="profile-bio-section">
            <h2 id="p-name"></h2>
            <div class="p-username" id="p-username"></div>
            <div class="p-meta" id="p-country"></div>
            <p class="p-bio" id="p-bio"></p>

            <div class="ext-bio-box">
              <div><b data-i18n="lbl_edu"></b> <span id="p-edu"></span></div>
              <div><b data-i18n="lbl_rel"></b> <span id="p-rel"></span></div>
              <div><b data-i18n="lbl_relig"></b> <span id="p-relig"></span></div>
              <div><b data-i18n="lbl_hobby"></b> <span id="p-hobby"></span></div>
              <div><b data-i18n="lbl_city"></b> <span id="p-city"></span></div>
            </div>
          </div>

          <div class="profile-actions-ig">
            <button class="btn ghost" id="btn-edit" data-i18n="edit_profile"></button>
            <button class="btn ghost" id="btn-people" data-i18n="people"></button>
          </div>

          <div class="profile-tabs">
            <button type="button" class="profile-tab-btn on" id="ptab-posts-btn" onclick="switchProfileTab('posts')">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
              <span data-i18n="posts_tab"></span>
            </button>
            <button type="button" class="profile-tab-btn" id="ptab-photos-btn" onclick="switchProfileTab('photos')">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              <span data-i18n="photos_tab"></span>
            </button>
          </div>

          <div id="profile-posts-area"></div>
          <div id="profile-photos-area" class="hidden"></div>
        </div>
      </div>
    </section>
  </main>

  <nav>
    <div class="nav-in">
      <button class="nav-btn on" data-tab="home">
        <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span data-i18n="n_home"></span>
      </button>
      <button class="nav-btn" data-tab="prompt">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span data-i18n="n_prompt"></span>
      </button>
      <button class="nav-rec" id="btn-record">
        <span class="dot"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
      </button>
      <button class="nav-btn" data-tab="groups">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span data-i18n="n_groups"></span>
      </button>
      <button class="nav-btn" data-tab="profile">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span data-i18n="n_profile"></span>
      </button>
    </div>
  </nav>
</div>

<!-- Sheets & Modals -->
<div id="inbox-sheet" class="sheet hidden">
  <div class="sheet-in" style="height:85%; text-align:start; display:flex; flex-direction:column;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3 style="margin:0;" data-i18n="inbox_title"></h3>
      <button id="inbox-sheet-close" style="color:var(--muted); font-size:20px; border:0; background:none; cursor:pointer;">✕</button>
    </div>
    <div id="inbox-list" style="flex:1; overflow-y:auto; margin-bottom:12px;"></div>
    <button class="btn ghost sm" id="inbox-close-btn" style="width:100%; margin-top:auto;" data-i18n="btn_back"></button>
  </div>
</div>

<div id="notif-sheet" class="sheet hidden">
  <div class="sheet-in" style="height:85%; text-align:start; display:flex; flex-direction:column;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3 style="margin:0;" data-i18n="notif_title"></h3>
      <button id="notif-sheet-close" style="color:var(--muted); font-size:20px; border:0; background:none; cursor:pointer;">✕</button>
    </div>

if (!I18N[lang]) lang = 'en';
const t = k => (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k;

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  if (currentUser) { renderProfile(); if (currentTab === 'prompt') loadPrompt(); if (currentTab === 'home' && typeof loadFeed === 'function') loadFeed(); }
}
function setLang(code) {
  lang = code;
  try { localStorage.setItem('talkia_lang', code); } catch(e) {}
  applyLang();
  populateFilterDropdowns();
}

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastTimer;
function toast(msg) {
  const el = $('toast'); if (!el) return;

  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.add('hidden'), 2200);

function setMode(m) {
  mode = m;
  const ml = $('mode-login'), ms = $('mode-signup'), nf = $('name-field'), asub = $('auth-submit'), pw = $('password'), amsg = $('auth-msg');
  if (ml) ml.classList.toggle('on', m === 'login');
  if (ms) ms.classList.toggle('on', m === 'signup');
  if (nf) nf.classList.toggle('hidden', m !== 'signup');
  if (asub) asub.textContent = t(m === 'login' ? 'login' : 'signup');
  if (pw) pw.autocomplete = m === 'login' ? 'current-password' : 'new-password';
  if (amsg) amsg.textContent = '';

if ($('auth-form')) {
  $('auth-form').onsubmit = async e => {
    e.preventDefault();
    const email = $('email').value.trim(), password = $('password').value, msg = $('auth-msg');
    if (msg) { msg.className = 'msg'; msg.textContent = ''; }
    if ($('auth-submit')) $('auth-submit').disabled = true;
    try {
      if (mode === 'signup') {
        const { data, error } = await sb.auth.signUp({ email, password, options: { data: { name: $('name').value.trim() || t('user') } } });
        if (error) throw error;
        if (!data.session && msg) { msg.className = 'msg ok'; msg.textContent = t('check_email'); }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
    } catch (err) {
      if (msg) msg.textContent = err.message || String(err);
    } finally {
      if ($('auth-submit')) $('auth-submit').disabled = false;
    }
  };
}

async function onSession(session) {

  showTab('home');

let feedPage = 0; const PAGE = 10;
const playSvg = '<path d="M7 4l13 8-13 8z"/>', pauseSvg = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';

function timeAgo(dateString) {
  if (!dateString) return t('time_just_now');
  const now = new Date();
  const past = new Date(dateString);
  const diffSec = Math.floor((now - past) / 1000);
  if (diffSec < 60) return t('time_just_now');
  const diffMin = Math.floor(diffSec / 60);
  if (diffMin < 60) return diffMin + t('time_m_ago');
  const diffHour = Math.floor(diffMin / 60);
  if (diffHour < 24) return diffHour + t('time_h_ago');
  const diffDay = Math.floor(diffHour / 24);
  return diffDay + t('time_d_ago');
}

const audio = new Audio(); let activeIcon = null, activeBar = null;
function stopIcon() { if (activeIcon) activeIcon.querySelector('svg').innerHTML = playSvg; }
audio.ontimeupdate = () => { if (activeBar && audio.duration) activeBar.style.width = (audio.currentTime / audio.duration * 100) + '%'; };
audio.onended = () => { stopIcon(); if (activeBar) activeBar.style.width = '0'; };

const feedListEl = $('feed-list');
if (feedListEl) {
  feedListEl.onclick = async e => {
    if (e.target.closest('#feed-more')) { feedPage++; if(typeof loadFeed === 'function') loadFeed(true); return; }

    const pl = e.target.closest('[data-play]');
    if (pl) {
      if (activeIcon === pl && !audio.paused) { audio.pause(); stopIcon(); return; }
      if (activeIcon !== pl) { stopIcon(); if (activeBar) activeBar.style.width = '0'; activeIcon = pl; activeBar = pl.parentNode.querySelector('.wave b'); audio.src = pl.dataset.play; }
      audio.play().then(() => { pl.querySelector('svg').innerHTML = pauseSvg; }).catch(() => toast('Audio play error'));
      return;
    }

    const lk = e.target.closest('[data-like]');
    if (lk) {
      window.toggleLike(lk.dataset.like);
      return;
    }
    
    const cm = e.target.closest('[data-cm]');
    if (cm) openComments(cm.dataset.cm, cm.querySelector('span'));
  };
}

let cmPost = null, cmSpan = null;
async function loadComments() {
  const { data, error } = await sb.from('comment_feed').select('*').eq('voice_post_id', cmPost).order('created_at', { ascending: true }).limit(50);
  const cmList = $('cm-list');
  if (cmList) {
    cmList.innerHTML = error ? esc(error.message) : (data && data.length ? data.map(c => '<div class="cm" style="display:flex; gap:10px; margin-bottom:10px; align-items:flex-start;"><div class="uav">' + (c.avatar_url ? `<img src="${esc(c.avatar_url)}">` : esc((c.display_name || 'U').charAt(0))) + '</div><div><b>' + esc(c.display_name || t('user')) + '</b><div style="font-size:13px; margin-top:2px;">' + esc(c.body || '') + '</div></div></div>').join('') : '<div class="muted">' + esc(t('none_yet')) + '</div>');
  }
}
function openComments(id, span) { cmPost = id; cmSpan = span; const cl = $('cm-list'); if(cl) cl.innerHTML = ''; const cs = $('cm-sheet'); if(cs) cs.classList.remove('hidden'); loadComments(); }
if ($('cm-close')) $('cm-close').onclick = () => { const cs = $('cm-sheet'); if(cs) cs.classList.add('hidden'); };

if ($('cm-form')) {
  $('cm-form').onsubmit = async e => {
    e.preventDefault();
    const bodyInput = $('cm-in');
    const body = bodyInput ? bodyInput.value.trim() : ''; 
    if (!body || !currentUser) return;
    const { error } = await sb.from('comments').insert({ user_id: currentUser.id, voice_post_id: cmPost, body });
    if (error) { toast(error.message); return; }
    if (bodyInput) bodyInput.value = ''; 
    if (cmSpan) cmSpan.textContent = Number(cmSpan.textContent) + 1;
    loadComments();
  };
}

document.addEventListener('DOMContentLoaded', () => {
  const btnRecord = document.getElementById('btn-record');
  if (btnRecord) {
    btnRecord.onclick = (e) => {
      e.preventDefault();
      const recSheet = document.getElementById('rec-sheet');
      if (recSheet) recSheet.classList.remove('hidden');
    };
  }

  const recClose = document.getElementById('rec-close');
  if (recClose) {
    recClose.onclick = () => {
      const recSheet = document.getElementById('rec-sheet');
      if (recSheet) recSheet.classList.add('hidden');
    };
  }

  const btnSearch = document.getElementById('btn-search');
  if (btnSearch) {
    btnSearch.onclick = (e) => {
      e.preventDefault();
      const searchSheet = document.getElementById('search');
      if (searchSheet) searchSheet.classList.remove('hidden');
    };
  }

  const srClose = document.getElementById('sr-close');
  if (srClose) {
    srClose.onclick = () => {
      const searchSheet = document.getElementById('search');
      if (searchSheet) searchSheet.classList.add('hidden');
    };
  }

  const ppClose = document.getElementById('pp-close');
  if (ppClose) {
    ppClose.onclick = () => {
      const peopleSheet = document.getElementById('people');
      if (peopleSheet) peopleSheet.classList.add('hidden');
    };
  }
});

function logout() {
  sb.auth.signOut().then(() => {
    window.location.reload();
  });
}

applyLang();
setMode('login');
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
