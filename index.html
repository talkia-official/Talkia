<!doctype html>
<html lang="bn" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talkia</title>
<meta name="theme-color" content="#0a0d14">
<meta name="description" content="Talkia - The Voice Universe">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0d14; --surface:#121826; --surface2:#1a2234; --line:#26314a;
  --text:#eef2fb; --muted:#8b97b3; --accent:#2f6bff; --accent-text:#7aa5ff; --accent-ink:#ffffff; --danger:#ef6b5b;
  --nav-h:68px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Hind Siliguri","Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none !important}

#auth{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px 20px}
.auth-card{width:100%;max-width:400px}
.brand{text-align:center;margin-bottom:28px}
.brand .badge{display:inline-block;background:#fff;border-radius:22px;padding:16px 26px;box-shadow:0 12px 44px rgba(47,107,255,.28)}
.brand .badge img{height:58px;display:block}
.bn-name{margin-top:14px;font-size:20px;font-weight:600;color:var(--accent-text)}
.hbadge{display:flex;background:#fff;border-radius:11px;padding:6px 12px}
.hbadge img{height:24px;display:block}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
.seg button{padding:10px;border-radius:99px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.field{margin-bottom:12px}
.field label{display:block;margin-bottom:4px;font-size:13px;color:var(--muted)}
.field input,.field textarea,.field select{width:100%;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);outline:none;color:var(--text)}
.field textarea{resize:none;min-height:84px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.btn{width:100%;padding:14px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px}
.btn:disabled{opacity:.6}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.msg{min-height:20px;margin:10px 0;font-size:14px;text-align:center;color:var(--danger)}
.msg.ok{color:#7bd88f}
.langs{display:flex;gap:8px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.langs button{padding:7px 14px;border-radius:99px;border:1px solid var(--line);color:var(--muted);font-size:14px}
.langs button.on{border-color:var(--accent);color:var(--accent-text)}

#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  border-bottom:1px solid var(--line);background:var(--bg)}
.hdr-actions{display:flex;gap:6px}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.icon-btn svg{width:21px;height:21px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;overflow-y:auto;padding:16px 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px)}
.tab{display:none}.tab.active{display:block}
h2{margin:0 0 12px;font-size:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.muted{color:var(--muted)}
.tag{display:inline-block;background:var(--surface2);color:var(--accent-text);border-radius:99px;padding:3px 11px;font-size:13px;margin-inline-end:6px}
.prompt-text{font-size:21px;line-height:1.5;margin:10px 0 16px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .big{font-size:42px;margin-bottom:8px}
.post .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:8px}
.post .play{display:flex;align-items:center;gap:12px;margin-top:12px}
.post .play i{width:40px;height:40px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.post .play i svg{width:16px;height:16px;fill:var(--accent-ink)}
.post .wave{flex:1;height:30px;background:repeating-linear-gradient(90deg,var(--line) 0 3px,transparent 3px 7px);border-radius:4px;opacity:.8}

/* Profile Cover & Fixed Visitor Icon */
.profile-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:16px}
.cover-box{height:130px;background:linear-gradient(135deg, #1e293b, #0f172a);position:relative}
.cover-box img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.visitor-btn{position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);color:#fff;font-size:18px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,0.2);cursor:pointer;z-index:10}
.profile-top{text-align:center;padding:0 16px 20px;position:relative}
.avatar{width:92px;height:92px;border-radius:50%;margin:-46px auto 10px;background:var(--surface2);border:4px solid var(--surface);
  display:grid;place-items:center;font-size:38px;font-weight:700;color:var(--accent-text);position:relative;overflow:hidden;cursor:pointer;z-index:3}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}

.ext-bio-box{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-top:12px;text-align:left;font-size:13px;display:flex;flex-direction:column;gap:6px}
.ext-bio-box div{display:flex;align-items:center;gap:8px;color:var(--text)}

/* Profile Tabs */
.profile-tabs{display:flex;gap:10px;border-bottom:1px solid var(--line);margin-top:16px;padding-bottom:6px}
.profile-tab-btn{flex:1;font-weight:600;font-size:14px;color:var(--muted);padding:8px;cursor:pointer;text-align:center;background:none;border:0}
.profile-tab-btn.on{color:var(--accent-text);border-bottom:2px solid var(--accent)}

.filter-row{display:flex;gap:10px;margin-bottom:14px}
.filter-row select{flex:1;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--text);outline:none;font-size:14px}

nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:center;pointer-events:none}
.nav-in{pointer-events:auto;width:100%;max-width:560px;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;padding:8px 2px}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn.on{color:var(--accent-text)}
.nav-rec{position:relative;top:-14px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--accent-text);font-size:11px}
.nav-rec .dot{width:52px;height:52px;border-radius:50%;background:var(--accent);display:grid;place-items:center;
  box-shadow:0 6px 20px rgba(47,107,255,.5);border:3px solid var(--bg)}
.nav-rec .dot svg{width:24px;height:24px;stroke:var(--accent-ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{width:100%;max-width:560px;max-height:90%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));text-align:center;border-top:1px solid var(--line)}
.sheet-in h3{margin:0 0 8px;font-size:20px}
.sheet-in p{color:var(--muted);margin:0 0 18px}
.sheet-in form{text-align:start}
.sheet-in .btn{margin-top:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 30px + env(safe-area-inset-bottom));z-index:40;
  background:var(--surface2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90%}
</style>
</head>
<body>

<section id="auth" class="hidden">
  <div class="auth-card">
    <div class="brand">
      <div class="badge"><img src="logo-wordmark.png" alt="Talkia"></div>
      <div class="bn-name">টকিয়া</div>
      <p data-i18n="tagline"></p>
    </div>
    <div class="seg">
      <button id="mode-login" class="on" data-i18n="login"></button>
      <button id="mode-signup" data-i18n="signup"></button>
    </div>
    <form id="auth-form" autocomplete="on">
      <div class="field hidden" id="name-field"><input id="name" type="text" data-i18n-ph="name" autocomplete="name"></div>
      <div class="field"><input id="email" type="email" data-i18n-ph="email" autocomplete="email" required></div>
      <div class="field"><input id="password" type="password" data-i18n-ph="password" autocomplete="current-password" minlength="6" required></div>
      <div id="auth-msg" class="msg"></div>
      <button class="btn" id="auth-submit" type="submit" data-i18n="login"></button>
    </form>
    <div class="langs" data-langs></div>
  </div>
</section>

<div id="app" class="hidden">
  <header>
    <div class="hbadge"><img src="logo-wordmark.png" alt="Talkia"></div>
    <div class="hdr-actions">
      <button class="icon-btn" id="btn-inbox" aria-label="Inbox">
        <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.5 7.2L3 21l1.8-5.5A8 8 0 1 1 21 12z"/></svg>
      </button>
      <button class="icon-btn" id="btn-bell" aria-label="Notifications">
        <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10.3 20a2 2 0 0 0 3.4 0"/></svg>
      </button>
      <button class="icon-btn" id="btn-search" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l-.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <!-- Home / Feed Tab (Facebook Style Home Feed) -->
    <section id="tab-home" class="tab">
      <h2 data-i18n="t_home">হোম ফিড</h2>
      <div class="filter-row">
        <select id="feed-cat-select" onchange="onFeedFilterChange()">
          <option value="" data-i18n="all_cats"></option>
        </select>
        <select id="feed-country-select" onchange="onFeedFilterChange()">
          <option value="" data-i18n="all_countries"></option>
        </select>
      </div>
      <div id="feed-list"></div>
    </section>

    <section id="tab-prompt" class="tab">
      <h2 data-i18n="t_prompt"></h2>
      <div class="card">
        <span class="tag">#TalkiaToday</span>
        <div class="prompt-text" id="prompt-text">...</div>
        <button class="btn" id="prompt-answer" data-i18n="answer_prompt"></button>
      </div>
    </section>

    <!-- Group Rooms Tab -->
    <section id="tab-groups" class="tab">
      <h2 data-i18n="t_groups">গ্রুপ ভয়েস রুম</h2>
      <div class="card">
        <p class="muted" style="font-size:14px; margin-bottom:12px;">৫ থেকে ১০ জন একসাথে একটি গ্রুপ রুমে যুক্ত হয়ে লাইভ কথা বলতে পারেন।</p>
        <button class="btn" onclick="openCreateGroupRoomModal()">+ নতুন রুম তৈরি করুন</button>
      </div>
      <div id="group-rooms-list"></div>
    </section>

    <section id="tab-profile" class="tab">
      <div class="profile-card">
        <div class="cover-box">
          <img id="p-cover-img" src="" class="hidden" onclick="handleCoverClick()">
          <button class="visitor-btn" id="btn-visitors" title="Visitors">👁️</button>
          <input type="file" id="cover-input" accept="image/*" class="hidden">
        </div>

        <div class="profile-top">
          <div class="avatar" id="p-avatar" onclick="handleAvatarClick()">T</div>
          <input type="file" id="avatar-input" accept="image/*" class="hidden">
          
          <h2 id="p-name"></h2>
          <div class="muted" id="p-username"></div>
          <div class="p-meta" id="p-country"></div>
          <p class="p-bio" id="p-bio"></p>

          <div class="ext-bio-box">
            <div><b data-i18n="lbl_edu"></b> <span id="p-edu"></span></div>
            <div><b data-i18n="lbl_rel"></b> <span id="p-rel"></span></div>
            <div><b data-i18n="lbl_relig"></b> <span id="p-relig"></span></div>
            <div><b data-i18n="lbl_hobby"></b> <span id="p-hobby"></span></div>
            <div><b data-i18n="lbl_city"></b> <span id="p-city"></span></div>
          </div>

          <div class="profile-tabs">
            <button type="button" class="profile-tab-btn on" id="ptab-posts-btn" onclick="switchProfileTab('posts')" data-i18n="posts_tab"></button>
            <button type="button" class="profile-tab-btn" id="ptab-photos-btn" onclick="switchProfileTab('photos')" data-i18n="photos_tab"></button>
          </div>

          <div id="profile-posts-area" style="margin-top:14px; text-align:left;"></div>
          <div id="profile-photos-area" class="hidden" style="margin-top:14px; display:grid; grid-template-columns:repeat(3, 1fr); gap:6px;"></div>

          <div style="display:flex; gap:8px; justify-content:center; margin-top:14px;">
            <button class="btn ghost" id="btn-edit" data-i18n="edit_profile" style="margin:0"></button>
            <button class="btn ghost" id="btn-people" data-i18n="people" style="margin:0"></button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <nav>
    <div class="nav-in">
      <button class="nav-btn" data-tab="home">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span data-i18n="n_home">হোম</span>
      </button>
      <button class="nav-btn" data-tab="prompt">
        <svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6L12 16.7 6.7 19.6l1.1-6L3.4 9.4l6-.8z"/></svg>
        <span data-i18n="n_prompt"></span>
      </button>
      <button class="nav-rec" id="btn-record">
        <span class="dot"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
        <span data-i18n="n_record"></span>
      </button>
      <button class="nav-btn" data-tab="groups">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span data-i18n="n_groups">গ্রুপ</span>
      </button>
      <button class="nav-btn" data-tab="profile">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span data-i18n="n_profile"></span>
      </button>
    </div>
  </nav>
</div>

<!-- Edit Profile Sheet -->
<div id="edit-sheet" class="sheet hidden">
  <div class="sheet-in">
    <h3 data-i18n="edit_profile"></h3>
    <form id="edit-form" autocomplete="off">
      <div class="field"><label data-i18n="name"></label><input id="e-name" type="text" maxlength="40"></div>
      <div class="field"><label data-i18n="username"></label><input id="e-username" type="text" maxlength="20" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
      <div class="field"><label data-i18n="bio"></label><textarea id="e-bio" maxlength="200"></textarea></div>
      <div class="field"><label data-i18n="lbl_edu"></label><input id="e-edu" type="text" maxlength="60"></div>
      <div class="field"><label data-i18n="lbl_rel"></label><input id="e-rel" type="text" maxlength="40"></div>
      <div class="field"><label data-i18n="lbl_relig"></label><input id="e-relig" type="text" maxlength="40"></div>
      <div class="field"><label data-i18n="lbl_hobby"></label><input id="e-hobby" type="text" maxlength="60"></div>
      <div class="field"><label data-i18n="lbl_city"></label><input id="e-city" type="text" maxlength="50"></div>
      <div class="field"><label data-i18n="country"></label><input id="e-country" type="text" maxlength="40"></div>
      <div id="edit-msg" class="msg"></div>
      <button class="btn" id="edit-save" type="submit" data-i18n="save"></button>
      <button class="btn ghost" id="edit-cancel" type="button" data-i18n="btn_back"></button>
    </form>
  </div>
</div>

<!-- Post Creation Modal Sheet -->
<div id="rec-sheet" class="sheet hidden">
  <div class="sheet-in" style="text-align:start">
    <h3 data-i18n="rec_title" style="text-align:center"></h3>
    
    <div style="display:flex; gap:6px; margin-bottom:14px; background:var(--surface2); padding:4px; border-radius:10px;">
      <button type="button" id="ptype-text" onclick="setPostMode('text')" style="flex:1; padding:8px; border-radius:8px; font-size:13px; font-weight:600; background:var(--accent); color:#fff;" data-i18n="lbl_text">লেখা</button>
      <button type="button" id="ptype-voice" onclick="setPostMode('voice')" style="flex:1; padding:8px; border-radius:8px; font-size:13px; font-weight:600; color:var(--muted);" data-i18n="lbl_voice">ভয়েস</button>
      <button type="button" id="ptype-image" onclick="setPostMode('image')" style="flex:1; padding:8px; border-radius:8px; font-size:13px; font-weight:600; color:var(--muted);" data-i18n="lbl_image">ছবি</button>
    </div>

    <div id="text-post-area" style="margin-bottom:12px;">
      <div class="field"><textarea id="r-text-content" maxlength="500" data-i18n-ph="post_ph" style="min-height:110px; width:100%; padding:14px; border-radius:12px; background:var(--surface); border:1px solid var(--line); color:var(--text); outline:none;"></textarea></div>
    </div>

    <div id="voice-rec-area" class="hidden" style="text-align:center">
      <div id="rec-time" style="font-size:36px;font-weight:700;margin:6px 0 12px">0:00</div>
      <button class="btn" id="rec-btn" type="button" data-i18n="rec_start"></button>
      <audio id="rec-prev" controls class="hidden" style="width:100%;margin-top:12px"></audio>
    </div>

    <div id="image-upload-area" class="hidden" style="margin-bottom:12px; text-align:center;">
      <input type="file" id="post-img-file" accept="image/*" class="field">
    </div>

    <div id="rec-form" style="margin-top:12px">
      <div class="field"><select id="r-cat"></select></div>
      <div class="field"><select id="r-lang"></select></div>
      <div class="field"><select id="r-country"></select></div>
      <label style="display:flex;gap:10px;align-items:center;margin:6px 0 12px"><input type="checkbox" id="r-anon"><span data-i18n="anon_toggle"></span></label>
      <div id="rec-msg" class="msg"></div>
      <button class="btn" id="rec-post" type="button" data-i18n="rec_post"></button>
    </div>
    <button class="btn ghost sm" id="rec-close" type="button" data-i18n="btn_cancel" style="margin-top:14px"></button>
  </div>
</div>

<div id="cm-sheet" class="sheet hidden">

$('auth-form').onsubmit = async e => {
  e.preventDefault();
  const email = $('email').value.trim(), password = $('password').value, msg = $('auth-msg');
  msg.className = 'msg'; msg.textContent = '';
  $('auth-submit').disabled = true;
  try {
    if (mode === 'signup') {
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { name: $('name').value.trim() || t('user') } } });
      if (error) throw error;
      if (!data.session) { msg.className = 'msg ok'; msg.textContent = t('check_email'); }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });

  } catch (err) {
    msg.textContent = err.message || String(err);
  } finally {
    $('auth-submit').disabled = false;
  }
};

  $('auth').classList.add('hidden'); $('app').classList.remove('hidden');

async function loadUserMyPostsAndPhotos(userId) {
  const postsArea = $('profile-posts-area');
  const photosArea = $('profile-photos-area');
  if (!postsArea || !photosArea) return;

  const { data: posts } = await sb.from('voice_posts').select('*').eq('user_id', userId).order('created_at', { ascending: false });

    postsArea.innerHTML = `<div class="muted" style="text-align:center; padding:20px;">${t('none_yet')}</div>`;
    photosArea.innerHTML = `<div class="muted" style="text-align:center; padding:20px; grid-column:span 3;">${t('none_yet')}</div>`;
    return;
  }

  postsArea.innerHTML = posts.map(cardHtml).join('');
  const photoPosts = posts.filter(p => p.image_url);
  if (photoPosts.length === 0) {
    photosArea.innerHTML = `<div class="muted" style="text-align:center; padding:20px; grid-column:span 3;">${t('none_yet')}</div>`;

      </div>
    `).join('');
  }
}

function compressImage(file, maxSide, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const side = Math.min(img.width, img.height);
      const out = Math.min(maxSide, side);
      const c = document.createElement('canvas'); c.width = c.height = out;
      const sx = (img.width - side) / 2, sy = (img.height - side) / 2;
      c.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, out, out);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error('compress')), 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image')); };
    img.src = url;
  });
}

$('avatar-input').onchange = async e => {
  const file = e.target.files && e.target.files[0]; e.target.value = ''; if (!file) return;
  toast(t('uploading'));
  try {
    const blob = await compressImage(file, 512, 0.85);
    const path = currentUser.id + '/avatar.jpg';
    const { error } = await sb.storage.from('images').upload(path, blob, { upsert: true, contentType: 'image/jpeg' });
    if (error) throw error;
    const url = sb.storage.from('images').getPublicUrl(path).data.publicUrl + '?v=' + Date.now();
    await sb.from('profiles').update({ avatar_url: url }).eq('id', currentUser.id);
    await loadProfile(); toast(t('saved'));
  } catch (err) { toast(t('upload_fail') + (err.message || err)); }
};

if ($('cover-input')) {
  $('cover-input').onchange = async e => {
    const file = e.target.files && e.target.files[0]; e.target.value = ''; if (!file) return;
    toast(t('uploading'));
    try {
      const blob = await compressImage(file, 1024, 0.85);
      const path = currentUser.id + '/cover.jpg';
      const { error } = await sb.storage.from('images').upload(path, blob, { upsert: true, contentType: 'image/jpeg' });
      if (error) throw error;
      const url = sb.storage.from('images').getPublicUrl(path).data.publicUrl + '?v=' + Date.now();
      await sb.from('profiles').update({ cover_url: url }).eq('id', currentUser.id);
      await loadProfile(); toast(t('saved'));
    } catch (err) { toast(t('upload_fail') + (err.message || err)); }
  };
}

$('btn-edit').onclick = () => {
  const p = currentProfile || {};
  $('e-name').value = p.display_name || '';
  $('e-username').value = p.username || '';
  $('e-bio').value = p.bio || '';
  if ($('e-edu')) $('e-edu').value = p.education || '';
  if ($('e-rel')) $('e-rel').value = p.marital_status || '';
  if ($('e-relig')) $('e-relig').value = p.religion || '';
  if ($('e-hobby')) $('e-hobby').value = p.hobbies || '';
  if ($('e-city')) $('e-city').value = p.city || '';
  $('e-country').value = p.country || '';
  $('edit-msg').textContent = '';
  $('edit-sheet').classList.remove('hidden');
};
$('edit-cancel').onclick = () => $('edit-sheet').classList.add('hidden');

$('edit-form').onsubmit = async e => {
  e.preventDefault();
  const msg = $('edit-msg'); msg.className = 'msg'; msg.textContent = '';
  const uname = $('e-username').value.trim().toLowerCase();
  if (uname && !/^[a-z0-9_]{3,20}$/.test(uname)) { msg.textContent = t('bad_username'); return; }
  const upd = {
    display_name: $('e-name').value.trim() || t('user'),
    username: uname || null,
    bio: $('e-bio').value.trim() || null,
    education: $('e-edu')?.value.trim() || null,
    marital_status: $('e-rel')?.value.trim() || null,
    religion: $('e-relig')?.value.trim() || null,
    hobbies: $('e-hobby')?.value.trim() || null,
    city: $('e-city')?.value.trim() || null,
    country: $('e-country').value.trim() || null
  };
  $('edit-save').disabled = true;
  try {
    const { error } = await sb.from('profiles').update(upd).eq('id', currentUser.id);
    if (error) throw error;
    await loadProfile();
    $('edit-sheet').classList.add('hidden');
    toast(t('saved'));
  } catch (err) { msg.textContent = (err.code === '23505') ? t('taken') : (err.message || String(err)); }
  finally { $('edit-save').disabled = false; }
};

/* Page Refresh State Retention & Navigation */
function showTab(name) {
  currentTab = name;
  try { localStorage.setItem('talkia_tab', name); } catch(e) {}
  document.querySelectorAll('.tab').forEach(s => s.classList.toggle('active', s.id === 'tab-' + name));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  if (name === 'prompt') loadPrompt();
  if (name === 'home') loadFeed();
  if (name === 'groups') loadGroupRooms();
  if (name === 'profile') { renderProfile(); loadUserMyPostsAndPhotos(currentUser.id); }
  document.querySelector('main').scrollTop = 0;
}
document.querySelectorAll('.nav-btn').forEach(b => b.onclick = () => showTab(b.dataset.tab));

function todayISO() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
async function loadPrompt() {
  const el = $('prompt-text');
  const { data } = await sb.from('daily_prompts').select('*').eq('prompt_date', todayISO()).maybeSingle();
  if (!data) { el.textContent = t('no_prompt'); return; }
  const field = { bn: 'text_bn', en: 'text_en', ar: 'text_ar' }[lang];
  el.textContent = data[field] || data.text_bn;
}

let cats = [];
async function loadCats() {
  if (cats.length) return;
  const { data } = await sb.from('categories').select('*').order('id');
  cats = data || [];
  populateFilterDropdowns();
}
const catName = c => c['name_' + lang] || c.name_en || c.slug;
const COUNTRIES = ['BD', 'IN', 'SA', 'AE', 'GLOBAL'];

function populateFilterDropdowns() {
  const catSel = $('feed-cat-select');
  if (catSel) {
    catSel.innerHTML = '<option value="">' + t('all_cats') + '</option>' + cats.map(c => `<option value="${c.id}">${catName(c)}</option>`).join('');
  }
  const cSel = $('feed-country-select');
  if (cSel) {
    cSel.innerHTML = '<option value="">' + t('all_countries') + '</option>' + COUNTRIES.map(c => `<option value="${c}">${t('c_' + c)}</option>`).join('');
  }
}

function onFeedFilterChange() { loadFeed(); }

/* Post Creation Modes & Dedicated Text Box */
let postMode = 'text';
function setPostMode(mode) {
  postMode = mode;
  ['text', 'voice', 'image'].forEach(m => {
    const btn = $('ptype-' + m);
    if (btn) {
      btn.style.background = (m === mode) ? 'var(--accent)' : 'transparent';
      btn.style.color = (m === mode) ? '#fff' : 'var(--muted)';
    }
  });
  $('text-post-area').classList.toggle('hidden', mode !== 'text');
  $('voice-rec-area').classList.toggle('hidden', mode !== 'voice');
  $('image-upload-area').classList.toggle('hidden', mode !== 'image');
}

let mr = null, chunks = [], recBlob = null, recSecs = 0, recTimer = null, recStream = null;
const pickMime = () => ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/aac'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
const fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

function resetRec() {
  clearInterval(recTimer);
  if (recStream) recStream.getTracks().forEach(x => x.stop());
  if (mr && mr.state === 'recording') { mr.onstop = null; try { mr.stop(); } catch (e) {} }
  mr = null; chunks = []; recBlob = null; recSecs = 0; recStream = null;
  if($('r-text-content')) $('r-text-content').value = '';
  $('rec-time').textContent = '0:00'; $('rec-btn').textContent = t('rec_start'); $('rec-btn').classList.remove('danger');
  $('rec-prev').classList.add('hidden'); $('rec-prev').removeAttribute('src'); $('rec-msg').textContent = '';
}

async function openRec(caption) {
  resetRec(); await loadCats();
  setPostMode('text');
  if($('r-text-content')) $('r-text-content').value = caption || '';
  $('r-cat').innerHTML = cats.map(c => `<option value="${c.id}">${catName(c)}</option>`).join('');
  $('r-lang').innerHTML = ['bn', 'en', 'ar', 'hi'].map(x => `<option value="${x}">${t('l_' + x)}</option>`).join(''); $('r-lang').value = lang;
  $('r-country').innerHTML = COUNTRIES.map(x => `<option value="${x}">${t('c_' + x)}</option>`).join(''); $('r-country').value = 'BD';
  $('r-anon').checked = false;
  $('rec-sheet').classList.remove('hidden');
}

$('btn-record').onclick = () => openRec('');
$('prompt-answer').onclick = () => openRec('#TalkiaToday');
$('rec-close').onclick = () => { resetRec(); $('rec-sheet').classList.add('hidden'); };

$('rec-btn').onclick = async () => {
  const msg = $('rec-msg');
  if (mr && mr.state === 'recording') { mr.stop(); return; }
  resetRec();
  try {
    recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mime = pickMime();
    mr = mime ? new MediaRecorder(recStream, { mimeType: mime }) : new MediaRecorder(recStream);
    mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = () => {
      clearInterval(recTimer); recStream.getTracks().forEach(x => x.stop());
      recBlob = new Blob(chunks, { type: mr.mimeType || mime || 'audio/webm' });
      $('rec-prev').src = URL.createObjectURL(recBlob); $('rec-prev').classList.remove('hidden');
      $('rec-btn').textContent = t('rec_again'); $('rec-btn').classList.remove('danger');
    };
    mr.start();
    $('rec-btn').textContent = t('rec_stop'); $('rec-btn').classList.add('danger');
    recTimer = setInterval(() => { recSecs++; $('rec-time').textContent = fmt(recSecs); if (recSecs >= 60) mr.stop(); }, 1000);
  } catch (err) { msg.className = 'msg'; msg.textContent = t('mic_err'); }
};

$('rec-post').onclick = async () => {
  const msg = $('rec-msg'); msg.className = 'msg'; msg.textContent = '';
  let audioUrl = null, imageUrl = null;
  const textContent = $('r-text-content')?.value.trim() || '';

  if (postMode === 'voice') {
    if (!recBlob || recSecs < 3) { msg.textContent = t('too_short'); return; }
    if (recBlob.size > 2 * 1024 * 1024) { msg.textContent = t('too_big'); return; }
  } else if (postMode === 'text' && !textContent) {
    msg.textContent = 'দয়া করে কিছু লিখুন।'; return;
  }

  $('rec-post').disabled = true;
  try {
    if (postMode === 'voice' && recBlob) {
      const ty = recBlob.type.split(';')[0], ext = ty.includes('mp4') ? 'm4a' : ty.includes('aac') ? 'aac' : 'webm';
      const path = currentUser.id + '/' + Date.now() + '.' + ext;
      const up = await sb.storage.from('audio').upload(path, recBlob, { contentType: ty });
      if (up.error) throw up.error;
      audioUrl = sb.storage.from('audio').getPublicUrl(path).data.publicUrl;
    } else if (postMode === 'image') {
      const imgFile = $('post-img-file').files[0];
      if (imgFile) {
        const blob = await compressImage(imgFile, 1024, 0.85);
        const path = currentUser.id + '/post_' + Date.now() + '.jpg';
        const up = await sb.storage.from('images').upload(path, blob, { contentType: 'image/jpeg' });
        if (up.error) throw up.error;
        imageUrl = sb.storage.from('images').getPublicUrl(path).data.publicUrl;
      }
    }

    const { error } = await sb.from('voice_posts').insert({
      user_id: currentUser.id,
      audio_url: audioUrl,
      image_url: imageUrl,
      duration_seconds: recSecs,
      caption: (postMode === 'text' ? textContent : $('r-cap')?.value.trim()) || null,
      category_id: Number($('r-cat').value) || null,
      language: $('r-lang').value,
      country: $('r-country').value,
      is_anonymous: $('r-anon').checked
    });
    if (error) throw error;
    resetRec(); $('rec-sheet').classList.add('hidden'); toast(t('posted')); showTab('home');
  } catch (err) { msg.textContent = err.message || String(err); }
  finally { $('rec-post').disabled = false; }
};

let feedPage = 0; const PAGE = 10;
const playSvg = '<path d="M7 4l13 8-13 8z"/>', pauseSvg = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';

function cardHtml(p) {
  const c = cats.find(x => x.id === p.category_id);
  const nm = p.is_anonymous ? t('anon') : (p.display_name || t('user'));
  const av = p.is_anonymous ? '<div class="uav">?</div>' : `<div class="uav">${p.avatar_url ? `<img src="${esc(p.avatar_url)}">` : esc((p.display_name || 'T').charAt(0).toUpperCase())}</div>`;
  
  let mediaHtml = '';
  if (p.audio_url) {
    mediaHtml = `<div class="play"><i data-play="${esc(p.audio_url)}"><svg viewBox="0 0 24 24">${playSvg}</svg></i><div class="wave"><b></b></div><span class="muted" style="font-size:13px">${esc(fmt(p.duration_seconds || 0))}</span></div>`;
  }
  if (p.image_url) {
    mediaHtml += `<div style="margin-top:10px; border-radius:12px; overflow:hidden;"><img src="${esc(p.image_url)}" style="width:100%; max-height:300px; object-fit:cover;"></div>`;
  }

  return '<div class="card post" data-id="' + esc(p.id) + '"><div class="phead">' + av + '<div><div>' + esc(nm) + '</div><div class="muted" style="font-size:12px">' + new Date(p.created_at).toLocaleDateString() + '</div></div></div>'
    + '<div>' + (c ? '<span class="tag">' + esc(catName(c)) + '</span>' : '') + (p.country ? '<span class="tag">' + esc(t('c_' + p.country) === 'c_' + p.country ? p.country : t('c_' + p.country)) + '</span>' : '') + (p.language ? '<span class="tag">' + esc(p.language) + '</span>' : '') + '</div>'
    + (p.caption ? '<div style="margin-top:8px">' + esc(p.caption) + '</div>' : '')
    + mediaHtml
    + '<div class="acts"><button data-like="' + esc(p.id) + '" class="' + (p.liked ? 'on' : '') + '">' + (p.liked ? '♥' : '♡') + ' <span>' + Number(p.like_count) + '</span></button><button data-cm="' + esc(p.id) + '">💬 <span>' + Number(p.comment_count) + '</span></button></div></div>';
}

async function loadFeed(more) {
  await loadCats();
  const box = $('feed-list');
  if (!more) { feedPage = 0; box.innerHTML = '<div class="empty">' + esc(t('loading')) + '</div>'; }
  
  const feedCat = $('feed-cat-select')?.value || '';
  const feedCountry = $('feed-country-select')?.value || '';

  let q = sb.from('voice_feed').select('*').order('created_at', { ascending: false }).range(feedPage * PAGE, feedPage * PAGE + PAGE - 1);
  if (feedCat) q = q.eq('category_id', Number(feedCat));
  if (feedCountry) q = q.eq('country', feedCountry);

  const { data, error } = await q;
  const old = $('feed-more'); if (old) old.remove();
  if (error) { box.innerHTML = '<div class="empty">' + esc(error.message) + '</div>'; return; }
  if (!more) box.innerHTML = '';
  if (!data.length && !more) { box.innerHTML = '<div class="empty"><div class="big">🎙️</div>' + esc(t('feed_empty')) + '</div>'; return; }
  box.insertAdjacentHTML('beforeend', data.map(cardHtml).join(''));
  if (data.length === PAGE) box.insertAdjacentHTML('beforeend', '<button class="btn ghost sm" id="feed-more">' + esc(t('more')) + '</button>');
}

const audio = new Audio(); let activeIcon = null, activeBar = null;
function stopIcon() { if (activeIcon) activeIcon.querySelector('svg').innerHTML = playSvg; }
audio.ontimeupdate = () => { if (activeBar && audio.duration) activeBar.style.width = (audio.currentTime / audio.duration * 100) + '%'; };
audio.onended = () => { stopIcon(); if (activeBar) activeBar.style.width = '0'; };

$('feed-list').onclick = async e => {
  if (e.target.closest('#feed-more')) { feedPage++; loadFeed(true); return; }
  const pl = e.target.closest('[data-play]');
  if (pl) {
    if (activeIcon === pl && !audio.paused) { audio.pause(); stopIcon(); return; }
    if (activeIcon !== pl) { stopIcon(); if (activeBar) activeBar.style.width = '0'; activeIcon = pl; activeBar = pl.parentNode.querySelector('.wave b'); audio.src = pl.dataset.play; }
    audio.play().then(() => { pl.querySelector('svg').innerHTML = pauseSvg; }).catch(() => toast('অডিও প্লে হচ্ছে না'));
    return;
  }
  const lk = e.target.closest('[data-like]');
  if (lk) {
    const id = lk.dataset.like, on = lk.classList.contains('on'), sp = lk.querySelector('span');
    const res = on ? await sb.from('likes').delete().eq('user_id', currentUser.id).eq('voice_post_id', id)
                   : await sb.from('likes').insert({ user_id: currentUser.id, voice_post_id: id });
    if (res.error) { toast(res.error.message); return; }
    lk.classList.toggle('on', !on); sp.textContent = Math.max(0, Number(sp.textContent) + (on ? -1 : 1));
    lk.firstChild.textContent = (on ? '♡' : '♥') + ' ';
    return;
  }
  const cm = e.target.closest('[data-cm]');
  if (cm) openComments(cm.dataset.cm, cm.querySelector('span'));
};

let cmPost = null, cmSpan = null;
async function loadComments() {
  const { data, error } = await sb.from('comment_feed').select('*').eq('voice_post_id', cmPost).order('created_at', { ascending: true }).limit(50);
  $('cm-list').innerHTML = error ? esc(error.message) : (data.length ? data.map(c => '<div class="cm"><b>' + esc(c.display_name || t('user')) + '</b><div>' + esc(c.body || '') + '</div></div>').join('') : '<div class="muted">' + esc(t('none_yet')) + '</div>');
}
function openComments(id, span) { cmPost = id; cmSpan = span; $('cm-list').innerHTML = ''; $('cm-sheet').classList.remove('hidden'); loadComments(); }
$('cm-close').onclick = () => $('cm-sheet').classList.add('hidden');

$('cm-form').onsubmit = async e => {
  e.preventDefault();
  const body = $('cm-in').value.trim(); if (!body) return;
  const { error } = await sb.from('comments').insert({ user_id: currentUser.id, voice_post_id: cmPost, body });
  if (error) { toast(error.message); return; }
  $('cm-in').value = ''; if (cmSpan) cmSpan.textContent = Number(cmSpan.textContent) + 1;
  loadComments();
};

applyLang();
setMode('login');
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
